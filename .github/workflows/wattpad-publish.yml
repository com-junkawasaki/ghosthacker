name: Wattpad Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # daily at 18:00 UTC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install chromium
      - name: Publish to Wattpad
        run: pnpm wattpad:publish
        env:
          WATTPAD_EMAIL: ${{ secrets.WATTPAD_EMAIL }}
          WATTPAD_PASSWORD: ${{ secrets.WATTPAD_PASSWORD }}
          WATTPAD_WORK_ID: 402848261

