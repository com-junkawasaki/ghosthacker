apiVersion: v1
kind: Service
metadata:
  name: storyboard-temporal-ui
  namespace: temporal-system
  labels:
    app: temporal-ui
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: temporal-ui
    temporalCluster: storyboard-temporal
