apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: storyboard-editor

build:
  local:
    push: false
  artifacts:
    - image: storyboard-editor/backend
      context: ./backend
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "**/*.go"
            dest: /app
          - src: "**/*.mod"
            dest: /app
          - src: "**/*.sum"
            dest: /app
    - image: storyboard-editor/frontend
      context: .
      docker:
        dockerfile: Dockerfile.frontend
      sync:
        manual:
          - src: "src/**/*.{ts,svelte,js,css}"
            dest: /app/src
          - src: "package.json"
            dest: /app
          - src: "vite.config.ts"
            dest: /app
          - src: "svelte.config.js"
            dest: /app

deploy:
  kubectl:
    manifests:
      - k8s/namespace.yaml
      - k8s/backend-deployment.yaml
      - k8s/backend-service.yaml
      - k8s/frontend-deployment.yaml
      - k8s/frontend-service.yaml

portForward:
  - resourceType: service
    resourceName: storyboard-backend
    namespace: storyboard-editor
    port: 8081
    localPort: 8081
  - resourceType: service
    resourceName: storyboard-frontend
    namespace: storyboard-editor
    port: 1421
    localPort: 1421

profiles:
  - name: dev
    build:
      local:
        push: false
      artifacts:
        - image: storyboard-editor/backend
          context: ./backend
          docker:
            dockerfile: Dockerfile
            target: development
          sync:
            manual:
              - src: "**/*.go"
                dest: /app
              - src: "**/*.mod"
                dest: /app
              - src: "**/*.sum"
                dest: /app
        - image: storyboard-editor/frontend
          context: .
          docker:
            dockerfile: Dockerfile.frontend
            target: development
          sync:
            manual:
              - src: "src/**/*.{ts,svelte,js,css}"
                dest: /app/src
              - src: "package.json"
                dest: /app
              - src: "vite.config.ts"
                dest: /app
              - src: "svelte.config.js"
                dest: /app
    deploy:
      kubectl:
        manifests:
          - k8s/namespace.yaml
          - k8s/backend-deployment.yaml
          - k8s/backend-service.yaml
          - k8s/frontend-deployment.yaml
          - k8s/frontend-service.yaml
        flags:
          global:
            - --namespace=storyboard-editor
