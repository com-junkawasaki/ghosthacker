apiVersion: skaffold/v2beta26
kind: Config
metadata:
  name: storyboard-editor

build:
  local:
    push: false
  artifacts:
    - image: storyboard-editor/backend
      context: ./backend
      buildpacks:
        builder: paketobuildpacks/builder-jammy-base
        buildpacks:
          - paketo-buildpacks/go-dist
          - paketo-buildpacks/go-build
        env:
          - BP_GO_TARGETS=./cmd/server:server,./cmd/worker:worker
      sync:
        manual:
          - src: "**/*.go"
            dest: /workspace
          - src: "**/*.mod"
            dest: /workspace
          - src: "**/*.sum"
            dest: /workspace
    - image: storyboard-editor/frontend
      context: .
      docker:
        dockerfile: Dockerfile.frontend
      sync:
        manual:
          - src: "src/**/*.{ts,svelte,js,css}"
            dest: /app/src
          - src: "package.json"
            dest: /app
          - src: "vite.config.ts"
            dest: /app
          - src: "svelte.config.js"
            dest: /app

deploy:
  kubectl:
    manifests:
      - k8s/namespace.yaml
      - k8s/postgresql.yaml
      - k8s/scaffold-install.yaml
      - k8s/temporal-cluster.yaml
      - k8s/backend-deployment.yaml
      - k8s/backend-service.yaml
      - k8s/frontend-deployment.yaml
      - k8s/frontend-service.yaml

portForward:
  - resourceType: service
    resourceName: storyboard-backend
    namespace: storyboard-editor
    port: 8081
    localPort: 8081
  - resourceType: service
    resourceName: storyboard-frontend
    namespace: storyboard-editor
    port: 1421
    localPort: 1421
  - resourceType: service
    resourceName: storyboard-temporal-ui
    namespace: temporal-system
    port: 8080
    localPort: 8080
  - resourceType: service
    resourceName: storyboard-temporal-frontend
    namespace: temporal-system
    port: 7233
    localPort: 7233

profiles:
  - name: dev
    build:
      local:
        push: false
      artifacts:
        - image: storyboard-editor/backend
          context: ./backend
          buildpacks:
            builder: paketobuildpacks/builder-jammy-base
            buildpacks:
              - paketo-buildpacks/go-dist
              - paketo-buildpacks/go-build
            env:
              - BP_GO_TARGETS=./cmd/server/main.go:server,./cmd/worker/main.go:worker
          sync:
            manual:
              - src: "**/*.go"
                dest: /workspace
              - src: "**/*.mod"
                dest: /workspace
              - src: "**/*.sum"
                dest: /workspace
        - image: storyboard-editor/frontend
          context: .
          docker:
            dockerfile: Dockerfile.frontend
            target: development
          sync:
            manual:
              - src: "src/**/*.{ts,svelte,js,css}"
                dest: /app/src
              - src: "package.json"
                dest: /app
              - src: "vite.config.ts"
                dest: /app
              - src: "svelte.config.js"
                dest: /app
    deploy:
      kubectl:
        manifests:
          - k8s/namespace.yaml
          - k8s/postgresql.yaml
          - k8s/scaffold-install.yaml
          - k8s/temporal-cluster.yaml
          - k8s/backend-deployment.yaml
          - k8s/backend-service.yaml
          - k8s/frontend-deployment.yaml
          - k8s/frontend-service.yaml
        flags:
          global:
            - --namespace=storyboard-editor
