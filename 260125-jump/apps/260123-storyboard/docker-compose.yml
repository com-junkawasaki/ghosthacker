services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: storyboard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=password
      - POSTGRES_SEEDS=db
    ports:
      - "7233:7233"
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.server
      target: development
    env_file:
      - .env
    environment:
      - PORT=8081
      - DB_URL=postgres://postgres:password@db:5432/storyboard?sslmode=disable
      - TEMPORAL_HOST=temporal:7233
      - WORKSPACE_ROOT=/workspace
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-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}
    ports:
      - "8081:8081"
    volumes:
      - ./server:/app
      - ../../../260125-jump:/workspace/260125-jump
    depends_on:
      temporal:
        condition: service_started

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
      target: development
    environment:
      - DB_URL=postgres://postgres:password@db:5432/storyboard?sslmode=disable
      - TEMPORAL_HOST=temporal:7233
      - SERVER_URL=http://server:8081
      - WORKSPACE_ROOT=/workspace
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-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}
    volumes:
      - ./server:/app
      - ../../../260125-jump:/workspace/260125-jump
    depends_on:
      server:
        condition: service_started

  frontend:
    build:
      context: ./web
      dockerfile: ../Dockerfile.frontend
      target: development
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=http://localhost:8081
      - VITE_OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-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}
    ports:
      - "1421:1421"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - server
