apiVersion: apps/v1
kind: Deployment
metadata:
  name: storyboard-frontend
  namespace: storyboard-editor
  labels:
    app: storyboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storyboard-frontend
  template:
    metadata:
      labels:
        app: storyboard-frontend
    spec:
      containers:
        - name: frontend
          image: storyboard-editor/frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 1421
              name: http
          env:
            - name: PORT
              value: "1421"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
