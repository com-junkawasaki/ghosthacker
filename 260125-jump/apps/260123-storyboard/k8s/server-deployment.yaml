apiVersion: apps/v1
kind: Deployment
metadata:
  name: storyboard-server
  namespace: storyboard-editor
  labels:
    app: storyboard-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storyboard-server
  template:
    metadata:
      labels:
        app: storyboard-server
    spec:
      containers:
        - name: server
          image: storyboard-editor/server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: WORKSPACE_ROOT
              value: "/workspace"
            - name: PORT
              value: "8081"
            - name: TEMPORAL_ADDRESS
              value: "storyboard-temporal-frontend.temporal-system.svc.cluster.local:7233"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: workspace
          hostPath:
            path: /Users/junkawasaki/github/ghosthacker
            type: DirectoryOrCreate
