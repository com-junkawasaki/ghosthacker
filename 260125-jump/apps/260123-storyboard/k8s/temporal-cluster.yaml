apiVersion: temporal.io/v1
kind: TemporalCluster
metadata:
  name: storyboard-temporal
  namespace: temporal-system
spec:
  version: "1.24.0"
  image: temporalio/auto-setup:1.24
  
  numHistoryShards: 4
  
  persistence:
    defaultStore:
      sql:
        user: postgres
        password: postgres
        pluginName: "postgres12"
        databaseName: temporal
        connectAddr: "postgresql.storyboard-editor:5432"
        maxConns: 20
        maxIdleConns: 20
        tls:
          enabled: false
  
  services:
    frontend:
      replicas: 1
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "1000m"
    
    matching:
      replicas: 1
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    
    history:
      replicas: 1
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    
    worker:
      replicas: 1
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"
  
  ui:
    enabled: true
    replicas: 1
    image: temporalio/ui:2.26.2
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
