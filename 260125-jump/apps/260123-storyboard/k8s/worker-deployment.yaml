apiVersion: apps/v1
kind: Deployment
metadata:
  name: storyboard-worker
  namespace: storyboard-editor
  labels:
    app: storyboard-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storyboard-worker
  template:
    metadata:
      labels:
        app: storyboard-worker
    spec:
      containers:
        - name: worker
          image: storyboard-editor/worker:latest
          imagePullPolicy: Never
          env:
            - name: TEMPORAL_ADDRESS
              value: "storyboard-temporal-frontend.temporal-system.svc.cluster.local:7233"
            - name: TASK_QUEUE
              value: "storyboard-task-queue"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
