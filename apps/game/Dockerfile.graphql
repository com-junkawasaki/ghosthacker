FROM rust:1.75 as builder

WORKDIR /app

# 依存関係をコピーしてビルド
COPY Cargo.toml Cargo.lock ./
COPY game-core ./game-core
COPY game-graphql ./game-graphql

WORKDIR /app/game-graphql
RUN cargo build --release

FROM debian:bookworm-slim

RUN apt-get update && apt-get install -y \
    ca-certificates \
    && rm -rf /var/lib/apt/lists/*

WORKDIR /app

COPY --from=builder /app/game-graphql/target/release/game-graphql /app/

EXPOSE 8080

CMD ["/app/game-graphql"]

