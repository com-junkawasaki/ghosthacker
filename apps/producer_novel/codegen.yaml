schema:
  - http://localhost:25325/graphql
documents: 'src/**/*.graphql'
generates:
  src/generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typed-document-node'
    config:
      useIndexSignature: true
      strictScalars: true
      dedupeFragments: true
      skipTypename: false
      scalars:
        JSON: any
