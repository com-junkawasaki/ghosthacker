services:
  postgres:
    image: postgres:16
    container_name: storyboard-editor-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storyboard-editor-network

  # Go gRPC Service (Connect protocol)
  grpc-go:
    build:
      context: ./performers/services/grpc-go
      dockerfile: Dockerfile
      target: development
    container_name: storyboard-editor-grpc-go
    ports:
      - "25326:8081"
    environment:
      # PostgreSQL Connection
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Server Configuration
      PORT: 8081
      HOST: 0.0.0.0
      # Temporal Configuration
      TEMPORAL_ADDRESS: temporal:7233
      # AI Service Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY:-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}
      HUME_API_KEY: ${HUME_API_KEY:-xWvZpzP8KzNfQqBIadWnjKcy7JWQmBifwW36zVJkX90MxRt2}
      SUNO_API_KEY: ${SUNO_API_KEY:-}
    volumes:
      - ./performers/services/grpc-go:/app
      - /app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storyboard-editor-network

  # Rust GraphQL Service (legacy, commented out)
  # graphql:
  #   build:
  #     context: ./performers/services/graphql
  #     dockerfile: Dockerfile
  #     target: development
  #   container_name: storyboard-editor-graphql
  #   ports:
  #     - "25326:8080"
  #   environment:
  #     NODE_ENV: development
  #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
  #     PORT: 8080
  #     HOST: 0.0.0.0
  #     OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  #     HUME_API_KEY: ${HUME_API_KEY:-}
  #     HUME_API_URL: ${HUME_API_URL:-https://api.hume.ai}
  #     CARGO_WATCH_IGNORE: "target/**"
  #   volumes:
  #     - ./performers/services/graphql:/app
  #     - /app/target
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - storyboard-editor-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: storyboard-editor-frontend
    ports:
      - "25322:5173"
    environment:
      NODE_ENV: development
      CI: "true"
      # Improve file watching reliability on macOS bind mounts
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: 1000
      # App URLs (loaded from host env / .envrc)
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:25322}
      # gRPC API URL
      PUBLIC_GRPC_API_URL: ${PUBLIC_GRPC_API_URL:-/api/grpc}
      GRPC_API_URL: ${GRPC_API_URL:-http://grpc-go:8081}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      grpc-go:
        condition: service_healthy
    networks:
      - storyboard-editor-network
    command: sh -c "pnpm install --no-frozen-lockfile && pnpm svelte-kit sync && pnpm dev --host 0.0.0.0"

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: storyboard-editor-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - storyboard-editor-network

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: storyboard-editor-temporal-ui
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal
    networks:
      - storyboard-editor-network

  # Temporal Worker
  temporal-worker:
    build:
      context: ./performers/services/grpc-go
      dockerfile: Dockerfile.worker
    container_name: storyboard-editor-temporal-worker
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    volumes:
      - ./performers/services/grpc-go:/app
    depends_on:
      - temporal
      - postgres
    networks:
      - storyboard-editor-network

volumes:
  postgres-data:

networks:
  storyboard-editor-network:
    name: storyboard-editor-network
    driver: bridge
