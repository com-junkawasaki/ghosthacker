schema: http://graphql:8080/graphql
documents: 
  - 'src/**/*.graphql'
  - 'src/**/*.{ts,tsx}'
generates:
  src/generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typed-document-node'
    config:
      useIndexSignature: true
      strictScalars: true
      dedupeFragments: true
      skipTypename: false

