{{- if .Values.temporal.enabled }}
apiVersion: temporal.io/v1
kind: TemporalCluster
metadata:
  name: {{ include "producer-storyboard.fullname" . }}-temporal
  namespace: temporal-system
spec:
  version: {{ .Values.temporal.version | default "1.24.0" }}
  image: {{ .Values.temporal.image.repository | default "temporalio/auto-setup" }}:{{ .Values.temporal.image.tag | default "1.24" }}
  
  numHistoryShards: 4
  
  persistence:
    defaultStore:
      sql:
        user: {{ .Values.temporal.database.user | default "postgres" }}
        password: {{ .Values.temporal.database.password | default "postgres" }}
        pluginName: "postgres12"
        databaseName: {{ .Values.temporal.database.database | default "temporal" }}
        connectAddr: "{{ .Values.temporal.database.host | default "postgresql" }}:{{ .Values.temporal.database.port | default "5432" }}"
        maxConns: 20
        maxIdleConns: 20
        tls:
          enabled: false
  
  services:
    frontend:
      replicas: {{ .Values.temporal.frontend.replicas | default 1 }}
      resources:
        requests:
          memory: {{ .Values.temporal.frontend.resources.requests.memory | default "512Mi" }}
          cpu: {{ .Values.temporal.frontend.resources.requests.cpu | default "500m" }}
        limits:
          memory: {{ .Values.temporal.frontend.resources.limits.memory | default "1Gi" }}
          cpu: {{ .Values.temporal.frontend.resources.limits.cpu | default "1000m" }}
    
    matching:
      replicas: {{ .Values.temporal.matching.replicas | default 1 }}
      resources:
        requests:
          memory: {{ .Values.temporal.matching.resources.requests.memory | default "256Mi" }}
          cpu: {{ .Values.temporal.matching.resources.requests.cpu | default "250m" }}
        limits:
          memory: {{ .Values.temporal.matching.resources.limits.memory | default "512Mi" }}
          cpu: {{ .Values.temporal.matching.resources.limits.cpu | default "500m" }}
    
    history:
      replicas: {{ .Values.temporal.history.replicas | default 1 }}
      resources:
        requests:
          memory: {{ .Values.temporal.history.resources.requests.memory | default "256Mi" }}
          cpu: {{ .Values.temporal.history.resources.requests.cpu | default "250m" }}
        limits:
          memory: {{ .Values.temporal.history.resources.limits.memory | default "512Mi" }}
          cpu: {{ .Values.temporal.history.resources.limits.cpu | default "500m" }}
    
    worker:
      replicas: {{ .Values.temporal.worker.replicas | default 1 }}
      resources:
        requests:
          memory: {{ .Values.temporal.worker.resources.requests.memory | default "256Mi" }}
          cpu: {{ .Values.temporal.worker.resources.requests.cpu | default "250m" }}
        limits:
          memory: {{ .Values.temporal.worker.resources.limits.memory | default "512Mi" }}
          cpu: {{ .Values.temporal.worker.resources.limits.cpu | default "500m" }}
  
  ui:
    enabled: {{ .Values.temporal.ui.enabled | default true }}
    replicas: {{ .Values.temporal.ui.replicas | default 1 }}
    image: {{ .Values.temporal.ui.image.repository | default "temporalio/ui" }}:{{ .Values.temporal.ui.image.tag | default "2.26.2" }}
    resources:
      requests:
        memory: {{ .Values.temporal.ui.resources.requests.memory | default "128Mi" }}
        cpu: {{ .Values.temporal.ui.resources.requests.cpu | default "100m" }}
      limits:
        memory: {{ .Values.temporal.ui.resources.limits.memory | default "256Mi" }}
        cpu: {{ .Values.temporal.ui.resources.limits.cpu | default "200m" }}
---
{{- end }}
