{{- if .Values.scaffold.enabled }}
apiVersion: temporal.io/v1
kind: TemporalCluster
metadata:
  name: {{ include "temporal.fullname" . }}
  namespace: {{ .Values.scaffold.namespace | default .Release.Namespace }}
spec:
  version: {{ .Values.temporal.version }}
  image: {{ .Values.temporal.image.repository }}:{{ .Values.temporal.image.tag }}
  
  numHistoryShards: 4
  
  persistence:
    defaultStore:
      sql:
        user: {{ .Values.temporal.database.user }}
        password: {{ .Values.temporal.database.password }}
        pluginName: "postgres12"
        databaseName: {{ .Values.temporal.database.database }}
        connectAddr: "{{ .Values.temporal.database.host }}:{{ .Values.temporal.database.port }}"
        maxConns: 20
        maxIdleConns: 20
        tls:
          enabled: false
  
  services:
    frontend:
      replicas: {{ .Values.temporal.frontend.replicas }}
      resources:
        {{- toYaml .Values.temporal.frontend.resources | nindent 8 }}
    
    matching:
      replicas: {{ .Values.temporal.matching.replicas }}
      resources:
        {{- toYaml .Values.temporal.matching.resources | nindent 8 }}
    
    history:
      replicas: {{ .Values.temporal.history.replicas }}
      resources:
        {{- toYaml .Values.temporal.history.resources | nindent 8 }}
    
    worker:
      replicas: {{ .Values.temporal.worker.replicas }}
      resources:
        {{- toYaml .Values.temporal.worker.resources | nindent 8 }}
  
  ui:
    enabled: {{ .Values.temporal.ui.enabled }}
    replicas: {{ .Values.temporal.ui.replicas }}
    image: {{ .Values.temporal.ui.image.repository }}:{{ .Values.temporal.ui.image.tag }}
    resources:
      {{- toYaml .Values.temporal.ui.resources | nindent 6 }}
---
{{- end }}
