# Temporal Server Configuration via Scaffold
scaffold:
  enabled: true
  namespace: temporal-system

# Temporal Server Cluster Configuration
temporal:
  version: "1.24.0"
  image:
    repository: temporalio/auto-setup
    tag: "1.24"
  
  # Database configuration (will use PostgreSQL from parent chart)
  database:
    type: postgresql
    host: postgresql
    port: 5432
    user: postgres
    password: postgres
    database: temporal
  
  # Server configuration
  frontend:
    replicas: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
  
  matching:
    replicas: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  
  history:
    replicas: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  
  worker:
    replicas: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  
  # UI Configuration
  ui:
    enabled: true
    replicas: 1
    image:
      repository: temporalio/ui
      tag: "2.26.2"
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
