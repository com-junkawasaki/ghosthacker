schemaVersion: '2.0.0'

commandTests:
  - name: "grpc-server binary exists"
    command: "test"
    args: ["-f", "/app/grpc-server"]
    exitCode: 0

  - name: "grpc-server is executable"
    command: "test"
    args: ["-x", "/app/grpc-server"]
    exitCode: 0

fileExistenceTests:
  - name: "migrations directory exists"
    path: "/app/migrations"
    shouldExist: true

metadataTest:
  exposedPorts: ["8081"]
  user: "appuser"
  workdir: "/app"
