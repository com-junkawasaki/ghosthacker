syntax = "proto3";

package manga.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/manga/v1;mangav1";

// ExportPageRequest represents a request to export a manga page
message ExportPageRequest {
  string page_id = 1;
  string format = 2; // "png", "jpeg", "pdf"
  optional int32 width = 3;
  optional int32 height = 4;
  optional double scale = 5; // Scale factor (default 1.0)
}

message ExportPageResponse {
  bytes export_data = 1; // Exported image/PDF bytes
  string filename = 2;
  string mime_type = 3;
}
