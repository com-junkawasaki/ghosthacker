syntax = "proto3";

package manga.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/manga/v1;mangav1";

import "manga/v1/manga.proto";
import "manga/v1/page.proto";
import "manga/v1/panel.proto";
import "manga/v1/speech_bubble.proto";
import "manga/v1/ai.proto";
import "manga/v1/export.proto";

// MangaService provides all manga-related operations
service MangaService {
  // Manga Project operations
  rpc ListMangaProjects(ListMangaProjectsRequest) returns (ListMangaProjectsResponse);
  rpc GetMangaProject(GetMangaProjectRequest) returns (MangaProject);
  rpc CreateMangaProject(CreateMangaProjectRequest) returns (MangaProject);
  rpc UpdateMangaProject(UpdateMangaProjectRequest) returns (MangaProject);
  rpc DeleteMangaProject(DeleteMangaProjectRequest) returns (DeleteMangaProjectResponse);
  
  // Page operations
  rpc ListPages(ListPagesRequest) returns (ListPagesResponse);
  rpc GetPage(GetPageRequest) returns (Page);
  rpc CreatePage(CreatePageRequest) returns (Page);
  rpc UpdatePage(UpdatePageRequest) returns (Page);
  rpc DeletePage(DeletePageRequest) returns (DeletePageResponse);
  rpc GetPageContent(GetPageContentRequest) returns (GetPageContentResponse);
  rpc UpdatePageContent(UpdatePageContentRequest) returns (UpdatePageContentResponse);
  
  // Panel operations
  rpc ListPanels(ListPanelsRequest) returns (ListPanelsResponse);
  rpc GetPanel(GetPanelRequest) returns (Panel);
  rpc CreatePanel(CreatePanelRequest) returns (Panel);
  rpc UpdatePanel(UpdatePanelRequest) returns (Panel);
  rpc DeletePanel(DeletePanelRequest) returns (DeletePanelResponse);
  
  // Speech Bubble operations
  rpc ListSpeechBubbles(ListSpeechBubblesRequest) returns (ListSpeechBubblesResponse);
  rpc GetSpeechBubble(GetSpeechBubbleRequest) returns (SpeechBubble);
  rpc CreateSpeechBubble(CreateSpeechBubbleRequest) returns (SpeechBubble);
  rpc UpdateSpeechBubble(UpdateSpeechBubbleRequest) returns (SpeechBubble);
  rpc DeleteSpeechBubble(DeleteSpeechBubbleRequest) returns (DeleteSpeechBubbleResponse);
  
  // AI Generation operations
  rpc GeneratePanelImage(GeneratePanelImageRequest) returns (GeneratePanelImageResponse);
  rpc GenerateStory(GenerateStoryRequest) returns (GenerateStoryResponse);
  
  // Export operations
  rpc ExportPage(ExportPageRequest) returns (ExportPageResponse);
}
