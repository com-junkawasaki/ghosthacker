syntax = "proto3";

package manga.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/manga/v1;mangav1";

// Page represents a manga page
message Page {
  string id = 1;
  string manga_project_id = 2;
  int32 page_number = 3;
  optional string konva_stage_json = 4; // Konva Stage JSON for canvas state
  string created_at = 5;
  string updated_at = 6;
}

message ListPagesRequest {
  string manga_project_id = 1;
}

message ListPagesResponse {
  repeated Page pages = 1;
}

message GetPageRequest {
  string id = 1;
}

message CreatePageRequest {
  string manga_project_id = 1;
  optional int32 page_number = 2;
}

message UpdatePageRequest {
  string id = 1;
  optional int32 page_number = 2;
  optional string konva_stage_json = 3;
}

message DeletePageRequest {
  string id = 1;
}

message DeletePageResponse {
  bool success = 1;
}

message GetPageContentRequest {
  string id = 1;
}

message GetPageContentResponse {
  optional string konva_stage_json = 1;
}

message UpdatePageContentRequest {
  string id = 1;
  string konva_stage_json = 2;
}

message UpdatePageContentResponse {
  bool success = 1;
}
