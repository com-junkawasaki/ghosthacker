syntax = "proto3";

package manga.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/manga/v1;mangav1";

// Panel represents a panel on a manga page
message Panel {
  string id = 1;
  string page_id = 2;
  int32 order_index = 3;
  double x = 4;
  double y = 5;
  double width = 6;
  double height = 7;
  optional string layout_type = 8; // "grid", "freeform", etc.
  optional string prompt = 9; // Story prompt for this panel
  string created_at = 10;
  string updated_at = 11;
}

message ListPanelsRequest {
  string page_id = 1;
}

message ListPanelsResponse {
  repeated Panel panels = 1;
}

message GetPanelRequest {
  string id = 1;
}

message CreatePanelRequest {
  string page_id = 1;
  optional int32 order_index = 2;
  optional double x = 3;
  optional double y = 4;
  optional double width = 5;
  optional double height = 6;
  optional string layout_type = 7;
  optional string prompt = 8;
}

message UpdatePanelRequest {
  string id = 1;
  optional int32 order_index = 2;
  optional double x = 3;
  optional double y = 4;
  optional double width = 5;
  optional double height = 6;
  optional string layout_type = 7;
  optional string prompt = 8;
}

message DeletePanelRequest {
  string id = 1;
}

message DeletePanelResponse {
  bool success = 1;
}
