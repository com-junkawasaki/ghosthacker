syntax = "proto3";

package manga.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/manga/v1;mangav1";

// SpeechBubbleType represents the type of speech bubble
enum SpeechBubbleType {
  SPEECH_BUBBLE_TYPE_UNSPECIFIED = 0;
  SPEECH_BUBBLE_TYPE_SPEECH = 1;
  SPEECH_BUBBLE_TYPE_THOUGHT = 2;
  SPEECH_BUBBLE_TYPE_SHOUT = 3;
}

// SpeechBubble represents a speech bubble on a panel
message SpeechBubble {
  string id = 1;
  string panel_id = 2;
  SpeechBubbleType bubble_type = 3;
  string text = 4;
  optional string speaker = 5; // Character name
  double x = 6;
  double y = 7;
  double width = 8;
  double height = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ListSpeechBubblesRequest {
  string panel_id = 1;
}

message ListSpeechBubblesResponse {
  repeated SpeechBubble speech_bubbles = 1;
}

message GetSpeechBubbleRequest {
  string id = 1;
}

message CreateSpeechBubbleRequest {
  string panel_id = 1;
  SpeechBubbleType bubble_type = 2;
  string text = 3;
  optional string speaker = 4;
  optional double x = 5;
  optional double y = 6;
  optional double width = 7;
  optional double height = 8;
}

message UpdateSpeechBubbleRequest {
  string id = 1;
  optional SpeechBubbleType bubble_type = 2;
  optional string text = 3;
  optional string speaker = 4;
  optional double x = 5;
  optional double y = 6;
  optional double width = 7;
  optional double height = 8;
}

message DeleteSpeechBubbleRequest {
  string id = 1;
}

message DeleteSpeechBubbleResponse {
  bool success = 1;
}
