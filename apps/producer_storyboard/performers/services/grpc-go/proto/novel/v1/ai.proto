syntax = "proto3";

package novel.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/novel/v1;novelv1";

import "novel/v1/emotion.proto";

// GenerateTextRequest represents a request to generate text using AI
message GenerateTextRequest {
  string novel_project_id = 1;
  optional string chapter_id = 2;
  string prompt = 3;
  optional string context_json = 4; // JSON string of context (selected nodes, masks, etc.)
  optional string generation_type = 5; // "generate", "summarize", "proofread", "translate"
  optional string target_language = 6; // For translation
}

message GenerateTextResponse {
  string generated_text = 1;
  optional EmotionProfile emotion_profile = 2; // If emotion analysis was performed
}

// GenerateImageRequest represents a request to generate an image using AI
message GenerateImageRequest {
  string novel_project_id = 1;
  optional string chapter_id = 2;
  string prompt = 3;
  optional string context_json = 4; // JSON string of context (selected nodes, masks, etc.)
  optional string model = 5; // "dall-e-3", "dall-e-2", "higgsfield", etc.
  optional string size = 6; // "1024x1024", "1792x1024", "1024x1792"
  optional string quality = 7; // "standard", "hd"
}

message GenerateImageResponse {
  string image_base64 = 1; // Base64-encoded image data
  string image_url = 2; // Optional URL if stored externally
}
