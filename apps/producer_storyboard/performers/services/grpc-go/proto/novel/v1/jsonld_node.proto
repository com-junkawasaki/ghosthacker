syntax = "proto3";

package novel.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/novel/v1;novelv1";

// JsonldNodeType represents the type of JSON-LD node
enum JsonldNodeType {
  JSONLD_NODE_TYPE_UNSPECIFIED = 0;
  JSONLD_NODE_TYPE_CHARACTER = 1;
  JSONLD_NODE_TYPE_GHOST = 2;
  JSONLD_NODE_TYPE_LOCATION = 3;
  JSONLD_NODE_TYPE_ORGANIZATION = 4;
  JSONLD_NODE_TYPE_COMPANY = 5;
  JSONLD_NODE_TYPE_TECHNOLOGY = 6;
  JSONLD_NODE_TYPE_EPISODE = 7;
  JSONLD_NODE_TYPE_SCENE = 8;
  JSONLD_NODE_TYPE_ARC = 9;
  JSONLD_NODE_TYPE_MOTIF = 10;
  JSONLD_NODE_TYPE_SEASON = 11;
  JSONLD_NODE_TYPE_TIMELINE = 12;
  JSONLD_NODE_TYPE_POV = 13;
  JSONLD_NODE_TYPE_BEAT = 14;
  JSONLD_NODE_TYPE_EVENT = 15;
  JSONLD_NODE_TYPE_SOURCE_REF = 16;
  JSONLD_NODE_TYPE_OCCUPATION = 17;
  JSONLD_NODE_TYPE_SETTING = 18;
}

// JsonldNode represents a JSON-LD semantic node
message JsonldNode {
  string id = 1;
  string novel_project_id = 2;
  JsonldNodeType node_type = 3;
  string name = 4;
  optional string description = 5;
  optional string attributes_json = 6; // JSON string of additional attributes
  optional string image_base64 = 7; // Base64-encoded image for character nodes
  string created_at = 8;
  string updated_at = 9;
}

message ListJsonldNodesRequest {
  string novel_project_id = 1;
  optional JsonldNodeType node_type = 2;
}

message ListJsonldNodesResponse {
  repeated JsonldNode nodes = 1;
}

message GetJsonldNodeRequest {
  string id = 1;
}

message UpsertJsonldNodeRequest {
  string novel_project_id = 1;
  JsonldNodeType node_type = 2;
  string name = 3;
  optional string description = 4;
  optional string attributes_json = 5;
  optional string image_base64 = 6;
  optional string id = 7; // If provided, updates existing node
}

message DeleteJsonldNodeRequest {
  string id = 1;
}

message DeleteJsonldNodeResponse {
  bool success = 1;
}
