syntax = "proto3";

package storyboard.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/storyboard/v1;storyboardv1";

// ProjectAsset represents a project-wide media asset
message ProjectAsset {
  string id = 1;
  string project_id = 2;
  string asset_type = 3; // 'image', 'video', 'audio', 'document'
  optional string asset_format = 4;
  optional string filename = 5;
  optional string description = 6;
  repeated string tags = 7;
  optional string metadata = 8; // JSON string
  string created_at = 9;
  string updated_at = 10;
}

message ListProjectAssetsRequest {
  string project_id = 1;
  optional string asset_type = 2; // Filter by asset type
  repeated string tags = 3; // Filter by tags
}

message ListProjectAssetsResponse {
  repeated ProjectAsset assets = 1;
}

message GetProjectAssetRequest {
  string id = 1;
}

message GetProjectAssetDataRequest {
  string asset_id = 1;
}

message GetProjectAssetDataResponse {
  string asset_data_base64 = 1;
  string asset_format = 2;
}

message CreateProjectAssetRequest {
  string project_id = 1;
  string asset_type = 2;
  string asset_data_base64 = 3; // Base64 encoded asset data
  optional string asset_format = 4;
  optional string filename = 5;
  optional string description = 6;
  repeated string tags = 7;
  optional string metadata = 8; // JSON string
}

message UpdateProjectAssetRequest {
  string id = 1;
  optional string filename = 2;
  optional string description = 3;
  repeated string tags = 4;
  optional string metadata = 5; // JSON string
}

message DeleteProjectAssetRequest {
  string id = 1;
}

message DeleteProjectAssetResponse {
  bool success = 1;
}
