syntax = "proto3";

package storyboard.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/storyboard/v1;storyboardv1";

// Dialogue represents a dialogue in a scene
message Dialogue {
  string id = 1;
  string scene_id = 2;
  string character_id = 3;
  string language = 4;
  string text = 5;
  optional string translated_text = 6;
  optional string hume_voice_id = 7;
  optional string audio_url = 8;
  optional double start_time_seconds = 9;
  optional double duration_seconds = 10;
  int32 order_index = 11;
  optional string emotion_name = 14;
  optional double emotion_x = 15;
  optional double emotion_y = 16;
  string created_at = 12;
  string updated_at = 13;
}

message ListDialoguesRequest {
  string scene_id = 1;
}

message ListDialoguesResponse {
  repeated Dialogue dialogues = 1;
}

message GetDialogueRequest {
  string id = 1;
}

message CreateDialogueRequest {
  string scene_id = 1;
  string character_id = 2;
  string language = 3;
  string text = 4;
  optional int32 order_index = 5;
  optional string hume_voice_id = 6;
  optional string emotion_name = 7;
  optional double emotion_x = 8;
  optional double emotion_y = 9;
}

message UpdateDialogueRequest {
  string id = 1;
  optional string text = 2;
  optional int32 order_index = 3;
  optional string hume_voice_id = 4;
  optional string emotion_name = 5;
  optional double emotion_x = 6;
  optional double emotion_y = 7;
}

message DeleteDialogueRequest {
  string id = 1;
}

message DeleteDialogueResponse {
  bool success = 1;
}

message GetDialogueAudioDataRequest {
  string dialogue_id = 1;
}

message GetDialogueAudioDataResponse {
  string audio_data_base64 = 1;
}

message GenerateDialogueAudioRequest {
  string dialogue_id = 1;
}

message GenerateDialogueAudioResponse {
  Dialogue dialogue = 1;
}

