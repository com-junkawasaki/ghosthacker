syntax = "proto3";

package storyboard.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/storyboard/v1;storyboardv1";

// Permission Level - 権限レベル
enum PermissionLevel {
  PERMISSION_LEVEL_UNSPECIFIED = 0;
  PERMISSION_LEVEL_VIEW = 1;      // L1: 閲覧のみ
  PERMISSION_LEVEL_EDIT = 2;      // L2: 編集可能
  PERMISSION_LEVEL_REVIEW = 3;    // L3: レビュー
  PERMISSION_LEVEL_APPROVE = 4;   // L4: 承認
  PERMISSION_LEVEL_ADMIN = 5;     // L5: 管理者
}

// Permission Scope - 権限対象
enum PermissionScope {
  PERMISSION_SCOPE_UNSPECIFIED = 0;
  PERMISSION_SCOPE_SCRIPT = 1;
  PERMISSION_SCOPE_STORYBOARD = 2;
  PERMISSION_SCOPE_ANIMATION = 3;
  PERMISSION_SCOPE_AUDIO = 4;
  PERMISSION_SCOPE_EDITING = 5;
  PERMISSION_SCOPE_ASSIGNMENT = 6;
  PERMISSION_SCOPE_BUDGET = 7;
}

// Department Type - 部門タイプ
enum DepartmentType {
  DEPARTMENT_TYPE_UNSPECIFIED = 0;
  DEPARTMENT_TYPE_PRODUCTION_LEADERSHIP = 1;
  DEPARTMENT_TYPE_CREATIVE_LEADERSHIP = 2;
  DEPARTMENT_TYPE_SCRIPT = 3;
  DEPARTMENT_TYPE_VISUAL = 4;
  DEPARTMENT_TYPE_DIRECTION = 5;
  DEPARTMENT_TYPE_AUDIO = 6;
  DEPARTMENT_TYPE_POST_PRODUCTION = 7;
}

// Department - 部門定義
message Department {
  string id = 1;
  string name = 2;
  string name_ja = 3;
  DepartmentType type = 4;
  int32 display_order = 5;
  string created_at = 6;
}

// RolePermission - 役職権限
message RolePermission {
  string id = 1;
  string role_id = 2;
  PermissionScope scope = 3;
  PermissionLevel level = 4;
}

// Role - 役職定義（権限付き）
message Role {
  string id = 1;
  string name = 2;
  string name_ja = 3;
  string department_id = 4;
  string description = 5;
  int32 display_order = 6;
  repeated RolePermission permissions = 7;
  string created_at = 8;
}

// TeamMember - チームメンバー
message TeamMember {
  string id = 1;
  string org_id = 2;
  string user_id = 3;  // Clerk user_id
  string name = 4;
  string email = 5;
  string avatar_url = 6;
  string created_at = 7;
}

// ProjectTeamAssignment - プロジェクトへのアサイン
message ProjectTeamAssignment {
  string id = 1;
  string project_id = 2;
  string team_member_id = 3;
  string role_id = 4;
  optional string episode_id = 5;  // 各話アサインの場合
  string assigned_at = 6;
  // Resolved fields
  TeamMember member = 7;
  Role role = 8;
}

// EpisodeTeamMember - 各話チームメンバー
message EpisodeTeamMember {
  string team_member_id = 1;
  string role_id = 2;
  TeamMember member = 3;
  Role role = 4;
}

// EpisodeTeam - 各話チーム編成
message EpisodeTeam {
  string id = 1;
  string project_id = 2;
  string episode_id = 3;
  string episode_number = 4;
  string episode_title = 5;
  repeated EpisodeTeamMember members = 6;
}

// RoleAssignment - 役職へのアサイン
message RoleAssignment {
  Role role = 1;
  repeated TeamMember members = 2;
}

// DepartmentSection - 部門セクション
message DepartmentSection {
  Department department = 1;
  repeated RoleAssignment assignments = 2;
}

// ProjectOrganization - プロジェクト組織図
message ProjectOrganization {
  string project_id = 1;
  repeated DepartmentSection departments = 2;
  repeated EpisodeTeam episode_teams = 3;
}

// Request/Response messages

message ListDepartmentsRequest {}

message ListDepartmentsResponse {
  repeated Department departments = 1;
}

message ListRolesRequest {
  optional string department_id = 1;
}

message ListRolesResponse {
  repeated Role roles = 1;
}

message GetProjectOrganizationRequest {
  string project_id = 1;
}

message ListTeamMembersRequest {
  string org_id = 1;
}

message ListTeamMembersResponse {
  repeated TeamMember members = 1;
}

message SyncClerkMembersRequest {
  string org_id = 1;
}

message SyncClerkMembersResponse {
  repeated TeamMember members = 1;
  int32 synced_count = 2;
}

message AssignTeamMemberRequest {
  string project_id = 1;
  string team_member_id = 2;
  string role_id = 3;
  optional string episode_id = 4;
}

message UnassignTeamMemberRequest {
  string assignment_id = 1;
}

message UnassignTeamMemberResponse {
  bool success = 1;
}

message ListProjectAssignmentsRequest {
  string project_id = 1;
  optional string episode_id = 2;
}

message ListProjectAssignmentsResponse {
  repeated ProjectTeamAssignment assignments = 1;
}

message CheckPermissionRequest {
  string user_id = 1;
  string project_id = 2;
  PermissionScope scope = 3;
  PermissionLevel required_level = 4;
}

message CheckPermissionResponse {
  bool allowed = 1;
  PermissionLevel user_level = 2;
}

message GetUserPermissionsRequest {
  string user_id = 1;
  string project_id = 2;
}

message GetUserPermissionsResponse {
  repeated RolePermission permissions = 1;
}
