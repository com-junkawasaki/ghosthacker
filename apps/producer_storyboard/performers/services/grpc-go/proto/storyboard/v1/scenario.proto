syntax = "proto3";

package storyboard.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/storyboard/v1;storyboardv1";

// Episode represents an episode within a scenario
message Episode {
  string id = 1;
  string scenario_id = 2;
  string title = 3;
  optional string description = 4;
  int32 order_index = 5;
  string created_at = 6;
  string updated_at = 7;
  repeated Part parts = 8;
}

// Part represents a part within an episode
message Part {
  string id = 1;
  string episode_id = 2;
  string title = 3;
  optional string description = 4;
  int32 order_index = 5;
  string created_at = 6;
  string updated_at = 7;
  repeated ScenePlan scene_plans = 8;
}

// ScenePlan represents a scene plan within a part
message ScenePlan {
  string id = 1;
  string part_id = 2;
  string description = 3;
  int32 order_index = 4;
  string created_at = 5;
  string updated_at = 6;
}

// Scenario represents a scenario
message Scenario {
  string id = 1;
  string project_id = 2;
  string title = 3;
  optional string description = 4;
  string created_at = 5;
  string updated_at = 6;
  repeated Episode episodes = 7;
}

message ListScenariosRequest {
  string project_id = 1;
}

message ListScenariosResponse {
  repeated Scenario scenarios = 1;
}

message GetScenarioRequest {
  string id = 1;
}

message CreateScenarioRequest {
  string project_id = 1;
  string title = 2;
  optional string description = 3;
}

message UpdateScenarioRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
}

message DeleteScenarioRequest {
  string id = 1;
}

message DeleteScenarioResponse {
  bool success = 1;
}

message ReorderPartsRequest {
  string episode_id = 1;
  repeated string part_ids = 2;
}

message ReorderPartsResponse {
  bool success = 1;
}

message ReorderScenePlansRequest {
  string part_id = 1;
  repeated string scene_plan_ids = 2;
}

message ReorderScenePlansResponse {
  bool success = 1;
}

