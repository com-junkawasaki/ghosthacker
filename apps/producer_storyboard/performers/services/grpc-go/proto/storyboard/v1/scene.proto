syntax = "proto3";

package storyboard.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/storyboard/v1;storyboardv1";

// Scene represents a scene within a storyboard
message Scene {
  string id = 1;
  string storyboard_id = 2;
  int32 scene_number = 3;
  optional string text_description = 4;
  optional string media_type = 5;
  optional string media_url = 6;
  optional double start_time_seconds = 7;
  optional double duration_seconds = 8;
  optional string transition_type = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ListScenesRequest {
  string storyboard_id = 1;
}

message ListScenesResponse {
  repeated Scene scenes = 1;
}

message GetSceneRequest {
  string id = 1;
}

message CreateSceneRequest {
  string storyboard_id = 1;
  int32 scene_number = 2;
  optional string text_description = 3;
  optional string media_type = 4;
  optional string transition_type = 5;
}

message UpdateSceneRequest {
  string id = 1;
  optional string text_description = 2;
  optional string media_type = 3;
  optional double start_time_seconds = 4;
  optional double duration_seconds = 5;
  optional string transition_type = 6;
}

message DeleteSceneRequest {
  string id = 1;
}

message DeleteSceneResponse {
  bool success = 1;
}

// GeneratedImage represents a generated image for a scene
message GeneratedImage {
  string id = 1;
  optional string scene_id = 2;
  optional string provider = 3; // "openai", "higgsfield", etc.
  optional string external_image_id = 4; // Provider-specific image ID
  optional string image_format = 5;
  optional string image_type = 6;
  optional string prompt = 7;
  optional string model = 8;
  optional string character_id = 9; // For character-specific images
  string created_at = 10;
}

message ListGeneratedImagesRequest {
  string scene_id = 1;
}

message ListGeneratedImagesResponse {
  repeated GeneratedImage images = 1;
}

message GetImageDataRequest {
  string image_id = 1;
}

message GetImageDataResponse {
  string image_data_base64 = 1;
}

message GenerateImageRequest {
  string scene_id = 1;
  string prompt = 2;
  optional string model = 3;
  optional string provider = 4; // "openai", "higgsfield", etc. Defaults to "openai"
  optional string character_id = 5; // For character-specific generation with Higgsfield Soul ID
}

message GenerateImageResponse {
  GeneratedImage image = 1;
}

