syntax = "proto3";

package storyboard.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/storyboard/v1;storyboardv1";

// Sponsor Status
enum SponsorStatus {
  SPONSOR_STATUS_UNSPECIFIED = 0;
  SPONSOR_STATUS_PROSPECT = 1;
  SPONSOR_STATUS_CONTACTED = 2;
  SPONSOR_STATUS_NEGOTIATING = 3;
  SPONSOR_STATUS_APPROVED = 4;
  SPONSOR_STATUS_REJECTED = 5;
}

// Event Type
enum SponsorEventType {
  SPONSOR_EVENT_TYPE_UNSPECIFIED = 0;
  SPONSOR_EVENT_TYPE_CONTACT = 1;
  SPONSOR_EVENT_TYPE_MEETING = 2;
  SPONSOR_EVENT_TYPE_PROPOSAL = 3;
  SPONSOR_EVENT_TYPE_RESPONSE = 4;
  SPONSOR_EVENT_TYPE_STATUS_CHANGE = 5;
}

// Post Visibility
enum SponsorPostVisibility {
  SPONSOR_POST_VISIBILITY_UNSPECIFIED = 0;
  SPONSOR_POST_VISIBILITY_PUBLIC = 1;
  SPONSOR_POST_VISIBILITY_ORG = 2;
  SPONSOR_POST_VISIBILITY_PRIVATE = 3;
}

// Sponsor
message Sponsor {
  string id = 1;
  string org_id = 2;
  optional string project_id = 3;
  string name = 4;
  optional string industry = 5;
  optional string contact_email = 6;
  optional string contact_phone = 7;
  optional string website = 8;
  optional string address = 9;
  optional string budget_min = 10;
  optional string budget_max = 11;
  map<string, string> preferences = 12; // JSONB preferences as key-value pairs
  SponsorStatus status = 13;
  optional string notes = 14;
  string created_at = 15;
  string updated_at = 16;
}

// Sponsor Contact
message SponsorContact {
  string id = 1;
  string sponsor_id = 2;
  string contact_name = 3;
  optional string role = 4;
  optional string email = 5;
  optional string phone = 6;
  bool is_primary = 7;
  string created_at = 8;
  string updated_at = 9;
}

// Sponsor History
message SponsorHistory {
  string id = 1;
  string sponsor_id = 2;
  SponsorEventType event_type = 3;
  string event_date = 4;
  optional string description = 5;
  map<string, string> metadata = 6; // JSONB metadata as key-value pairs
  string created_at = 7;
}

// Sponsor Post
message SponsorPost {
  string id = 1;
  string org_id = 2;
  string sponsor_id = 3;
  string title = 4;
  string content = 5;
  SponsorPostVisibility visibility = 6;
  string posted_at = 7;
  string created_at = 8;
  string updated_at = 9;
}

// Request/Response messages

message ListSponsorsRequest {
  string org_id = 1;
  optional string project_id = 2;
  optional SponsorStatus status = 3;
  optional string industry = 4;
  optional string search_query = 5;
}

message ListSponsorsResponse {
  repeated Sponsor sponsors = 1;
}

message GetSponsorRequest {
  string sponsor_id = 1;
}

message GetSponsorResponse {
  Sponsor sponsor = 1;
  repeated SponsorContact contacts = 2;
}

message CreateSponsorRequest {
  string org_id = 1;
  optional string project_id = 2;
  string name = 3;
  optional string industry = 4;
  optional string contact_email = 5;
  optional string contact_phone = 6;
  optional string website = 7;
  optional string address = 8;
  optional string budget_min = 9;
  optional string budget_max = 10;
  map<string, string> preferences = 11;
  optional string notes = 12;
}

message CreateSponsorResponse {
  Sponsor sponsor = 1;
}

message UpdateSponsorRequest {
  string sponsor_id = 1;
  optional string name = 2;
  optional string industry = 3;
  optional string contact_email = 4;
  optional string contact_phone = 5;
  optional string website = 6;
  optional string address = 7;
  optional string budget_min = 8;
  optional string budget_max = 9;
  map<string, string> preferences = 10;
  optional SponsorStatus status = 11;
  optional string notes = 12;
}

message UpdateSponsorResponse {
  Sponsor sponsor = 1;
}

message DeleteSponsorRequest {
  string sponsor_id = 1;
}

message DeleteSponsorResponse {
  bool success = 1;
}

message SearchSponsorsRequest {
  string org_id = 1;
  optional string query = 2;
  optional string industry = 3;
  optional string budget_min = 4;
  optional string budget_max = 5;
  optional SponsorStatus status = 6;
}

message SearchSponsorsResponse {
  repeated Sponsor sponsors = 1;
}

message ListSponsorContactsRequest {
  string sponsor_id = 1;
}

message ListSponsorContactsResponse {
  repeated SponsorContact contacts = 1;
}

message CreateSponsorContactRequest {
  string sponsor_id = 1;
  string contact_name = 2;
  optional string role = 3;
  optional string email = 4;
  optional string phone = 5;
  bool is_primary = 6;
}

message CreateSponsorContactResponse {
  SponsorContact contact = 1;
}

message UpdateSponsorContactRequest {
  string contact_id = 1;
  optional string contact_name = 2;
  optional string role = 3;
  optional string email = 4;
  optional string phone = 5;
  optional bool is_primary = 6;
}

message UpdateSponsorContactResponse {
  SponsorContact contact = 1;
}

message DeleteSponsorContactRequest {
  string contact_id = 1;
}

message DeleteSponsorContactResponse {
  bool success = 1;
}

message ListSponsorHistoryRequest {
  string sponsor_id = 1;
  optional SponsorEventType event_type = 2;
}

message ListSponsorHistoryResponse {
  repeated SponsorHistory history = 1;
}

message CreateSponsorHistoryRequest {
  string sponsor_id = 1;
  SponsorEventType event_type = 2;
  optional string event_date = 3;
  optional string description = 4;
  map<string, string> metadata = 5;
}

message CreateSponsorHistoryResponse {
  SponsorHistory history = 1;
}

message ContactSponsorRequest {
  string sponsor_id = 1;
  string contact_method = 2; // email, phone, meeting, etc.
  string description = 3;
  optional string contact_date = 4;
  map<string, string> metadata = 5;
}

message ContactSponsorResponse {
  SponsorHistory history = 1;
}

message UpdateSponsorStatusRequest {
  string sponsor_id = 1;
  SponsorStatus status = 2;
  optional string notes = 3;
}

message UpdateSponsorStatusResponse {
  Sponsor sponsor = 1;
  SponsorHistory history = 2;
}

message ListSponsorPostsRequest {
  string org_id = 1;
  optional string sponsor_id = 2;
  optional SponsorPostVisibility visibility = 3;
}

message ListSponsorPostsResponse {
  repeated SponsorPost posts = 1;
}

message CreateSponsorPostRequest {
  string org_id = 1;
  string sponsor_id = 2;
  string title = 3;
  string content = 4;
  SponsorPostVisibility visibility = 5;
}

message CreateSponsorPostResponse {
  SponsorPost post = 1;
}

message UpdateSponsorPostRequest {
  string post_id = 1;
  optional string title = 2;
  optional string content = 3;
  optional SponsorPostVisibility visibility = 4;
}

message UpdateSponsorPostResponse {
  SponsorPost post = 1;
}

message DeleteSponsorPostRequest {
  string post_id = 1;
}

message DeleteSponsorPostResponse {
  bool success = 1;
}
