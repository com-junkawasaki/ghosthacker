syntax = "proto3";

package storyboard.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/storyboard/v1;storyboardv1";

// Approval Status - 承認ステータス
enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_SUBMITTED = 1;
  APPROVAL_STATUS_UNDER_REVIEW = 2;
  APPROVAL_STATUS_REQUEST_CHANGES = 3;
  APPROVAL_STATUS_APPROVED = 4;
  APPROVAL_STATUS_REJECTED = 5;
}

// Approval Type - 承認タイプ
enum ApprovalType {
  APPROVAL_TYPE_UNSPECIFIED = 0;
  APPROVAL_TYPE_SCRIPT = 1;
  APPROVAL_TYPE_STORYBOARD = 2;
  APPROVAL_TYPE_KEY_ANIMATION = 3;
  APPROVAL_TYPE_AUDIO_MIX = 4;
  APPROVAL_TYPE_FINAL_CUT = 5;
}

// Production Status - 制作ステータス
enum ProductionStatus {
  PRODUCTION_STATUS_UNSPECIFIED = 0;
  PRODUCTION_STATUS_PLANNING = 1;
  PRODUCTION_STATUS_SCRIPT = 2;
  PRODUCTION_STATUS_STORYBOARD = 3;
  PRODUCTION_STATUS_LAYOUT = 4;
  PRODUCTION_STATUS_KEY_ANIMATION = 5;
  PRODUCTION_STATUS_IN_BETWEEN = 6;
  PRODUCTION_STATUS_COLORING = 7;
  PRODUCTION_STATUS_COMPOSITING = 8;
  PRODUCTION_STATUS_AUDIO_RECORDING = 9;
  PRODUCTION_STATUS_AUDIO_MIX = 10;
  PRODUCTION_STATUS_EDITING = 11;
  PRODUCTION_STATUS_FINAL_CHECK = 12;
  PRODUCTION_STATUS_DELIVERED = 13;
}

// Task Status - タスクステータス
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_CREATED = 1;
  TASK_STATUS_ASSIGNED = 2;
  TASK_STATUS_IN_PROGRESS = 3;
  TASK_STATUS_BLOCKED = 4;
  TASK_STATUS_REVIEW = 5;
  TASK_STATUS_COMPLETED = 6;
  TASK_STATUS_CANCELLED = 7;
}

// ApprovalRequest - 承認リクエスト
message ApprovalRequest {
  string id = 1;
  string project_id = 2;
  optional string episode_id = 3;
  ApprovalType type = 4;
  string submitter_id = 5;
  string resource_id = 6;      // 対象リソースID
  string resource_type = 7;    // scene, storyboard, audio等
  ApprovalStatus status = 8;
  string workflow_id = 9;
  string run_id = 10;
  string created_at = 11;
  string updated_at = 12;
}

// ApprovalAction - 承認アクション
message ApprovalAction {
  string id = 1;
  string approval_id = 2;
  string reviewer_id = 3;
  ApprovalStatus action = 4;
  string comment = 5;
  string created_at = 6;
}

// EpisodeProduction - 各話制作進行
message EpisodeProduction {
  string id = 1;
  string project_id = 2;
  string episode_id = 3;
  ProductionStatus status = 4;
  string deadline = 5;
  double progress_percent = 6;
  string workflow_id = 7;
  string run_id = 8;
  string created_at = 9;
  string updated_at = 10;
}

// Task - タスク
message Task {
  string id = 1;
  string project_id = 2;
  optional string episode_id = 3;
  string title = 4;
  string description = 5;
  string assignee_id = 6;
  string role_id = 7;
  TaskStatus status = 8;
  string deadline = 9;
  string workflow_id = 10;
  string run_id = 11;
  string created_at = 12;
  string updated_at = 13;
}

// Approval Workflow Request/Response

message StartApprovalWorkflowRequest {
  string project_id = 1;
  optional string episode_id = 2;
  ApprovalType type = 3;
  string resource_id = 4;
  string resource_type = 5;
}

message StartApprovalWorkflowResponse {
  string workflow_id = 1;
  string run_id = 2;
  ApprovalRequest approval = 3;
}

message SubmitApprovalActionRequest {
  string approval_id = 1;
  ApprovalStatus action = 2;
  string comment = 3;
}

message ListApprovalRequestsRequest {
  string project_id = 1;
  optional string episode_id = 2;
  optional ApprovalStatus status = 3;
  optional ApprovalType type = 4;
}

message ListApprovalRequestsResponse {
  repeated ApprovalRequest requests = 1;
}

message GetApprovalRequestRequest {
  string id = 1;
}

message ListApprovalActionsRequest {
  string approval_id = 1;
}

message ListApprovalActionsResponse {
  repeated ApprovalAction actions = 1;
}

// Production Workflow Request/Response

message StartProductionWorkflowRequest {
  string project_id = 1;
  string episode_id = 2;
  string deadline = 3;
}

message StartProductionWorkflowResponse {
  string workflow_id = 1;
  string run_id = 2;
  EpisodeProduction production = 3;
}

message GetEpisodeProductionRequest {
  string project_id = 1;
  string episode_id = 2;
}

message ListEpisodeProductionsRequest {
  string project_id = 1;
}

message ListEpisodeProductionsResponse {
  repeated EpisodeProduction productions = 1;
}

message UpdateProductionStatusRequest {
  string project_id = 1;
  string episode_id = 2;
  ProductionStatus status = 3;
  optional double progress_percent = 4;
}

// Task Workflow Request/Response

message StartTaskWorkflowRequest {
  string project_id = 1;
  optional string episode_id = 2;
  string title = 3;
  string description = 4;
  string role_id = 5;
  string deadline = 6;
}

message StartTaskWorkflowResponse {
  string workflow_id = 1;
  string run_id = 2;
  Task task = 3;
}

message AssignTaskRequest {
  string task_id = 1;
  string assignee_id = 2;
}

message UpdateTaskStatusRequest {
  string task_id = 1;
  TaskStatus status = 2;
}

message ListTasksRequest {
  string project_id = 1;
  optional string episode_id = 2;
  optional string assignee_id = 3;
  optional TaskStatus status = 4;
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message GetTaskRequest {
  string id = 1;
}
