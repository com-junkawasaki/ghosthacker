syntax = "proto3";

package gftd.ghosthacker.storyboard.v1;

option go_package = "storyboard-editor/backend/proto;storyboardpb";

// StoryboardService provides operations for editing and managing storyboard JSON-LD files
service StoryboardService {
  // Load storyboard JSON-LD from file
  rpc LoadStoryboard(LoadStoryboardRequest) returns (LoadStoryboardResponse);
  
  // Update a specific panel/cut in the storyboard
  rpc UpdatePanel(UpdatePanelRequest) returns (UpdatePanelResponse);
  
  // Save storyboard JSON-LD to file
  rpc SaveStoryboard(SaveStoryboardRequest) returns (SaveStoryboardResponse);
  
  // Get episode list from storyboard
  rpc GetEpisodes(GetEpisodesRequest) returns (GetEpisodesResponse);
  
  // Get arc list from storyboard
  rpc GetArcs(GetArcsRequest) returns (GetArcsResponse);
  
  // Get panels for a specific episode
  rpc GetEpisodePanels(GetEpisodePanelsRequest) returns (GetEpisodePanelsResponse);
  
  // Get panels for a specific arc
  rpc GetArcPanels(GetArcPanelsRequest) returns (GetArcPanelsResponse);
  
  // Stream updates for real-time collaboration (optional)
  rpc StreamUpdates(StreamUpdatesRequest) returns (stream StreamUpdatesResponse);
  
  // Generate image for a panel using OpenRouter AI
  rpc GeneratePanelImage(GeneratePanelImageRequest) returns (GeneratePanelImageResponse);

  // Generate dialogue for a panel using OpenRouter (text)
  rpc GenerateDialogue(GenerateDialogueRequest) returns (GenerateDialogueResponse);

  // --- Multi-Agent Generation ---

  // Generate high-level scenario/plot beats
  rpc GenerateScenario(GenerateScenarioRequest) returns (GenerateScenarioResponse);

  // Generate detailed episode scenes and dialogue
  rpc GenerateEpisode(GenerateEpisodeRequest) returns (GenerateEpisodeResponse);

  // Refine character emotional states and consistency
  rpc RefineCharacters(RefineCharactersRequest) returns (RefineCharactersResponse);

  // Generate cinematic sketches and visual prompts
  rpc GenerateCinematicSketch(GenerateCinematicSketchRequest) returns (GenerateCinematicSketchResponse);

  // Interact with AI assistant for chat-based editing and generation
  rpc InteractWithAI(InteractWithAIRequest) returns (InteractWithAIResponse);

  // Start autonomous agent-to-agent generation workflow
  rpc StartAutonomousGeneration(StartAutonomousGenerationRequest) returns (StartAutonomousGenerationResponse);

  // Terminate a running autonomous generation workflow
  rpc TerminateAutonomousGeneration(TerminateAutonomousGenerationRequest) returns (TerminateAutonomousGenerationResponse);

  // Internal: Broadcast a chat message to all connected clients (used by workers)
  rpc InternalBroadcastChatMessage(InternalBroadcastChatMessageRequest) returns (InternalBroadcastChatMessageResponse);

  // Analyze the structure of an episode based on SHACL constraints
  rpc AnalyzeStructure(AnalyzeStructureRequest) returns (AnalyzeStructureResponse);

  // Persistence: Save chat session
  rpc SaveChatSession(SaveChatSessionRequest) returns (SaveChatSessionResponse);

  // Persistence: Get all chat sessions
  rpc GetChatSessions(GetChatSessionsRequest) returns (GetChatSessionsResponse);

  // Export storyboard to PDF
  rpc ExportPdf(ExportPdfRequest) returns (ExportPdfResponse);

  // List available projects in the workspace
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  // Switch the active project
  rpc SwitchProject(SwitchProjectRequest) returns (SwitchProjectResponse);

  // --- Image Generation Job Queue ---

  // Submit an image generation job to the queue
  rpc SubmitGenerationJob(SubmitGenerationJobRequest) returns (SubmitGenerationJobResponse);

  // Cancel a running or queued generation job
  rpc CancelGenerationJob(CancelGenerationJobRequest) returns (CancelGenerationJobResponse);

  // List all generation jobs (active and recent)
  rpc ListGenerationJobs(ListGenerationJobsRequest) returns (ListGenerationJobsResponse);
}

message ExportPdfRequest {
  string file_path = 1;
  string episode_id = 2;
  string arc_id = 3; // Optional: export by arc
  string mode = 4; // "storyboard", "manga", "script", "shooting"
}

message ExportPdfResponse {
  bool success = 1;
  string message = 2;
  bytes pdf_content = 3; // The generated PDF file content
  string filename = 4;
}

message InternalBroadcastChatMessageRequest {
  string agent_mode = 1;
  string content = 2;
  string role = 3; // "user", "assistant", "system", "debug", "error"
}

message InternalBroadcastChatMessageResponse {
  bool success = 1;
}

message AnalyzeStructureRequest {
  string file_path = 1;
  string episode_id = 2;
}

message AnalyzeStructureResponse {
  bool success = 1;
  string message = 2;
  StructuralMetrics metrics = 3;
}

message StructuralMetrics {
  int32 reading_units = 1;
  float dialogue_ratio = 2;
  int32 beat_count = 3;
  int32 panel_count = 4;
  repeated string validation_errors = 5;
}

message StartAutonomousGenerationRequest {
  string file_path = 1;
  string episode_id = 2;
  string goal = 3; // e.g. "Advance the story by 3 panels"
  repeated AIContext initial_context = 4;
  string session_id = 5;
}

message StartAutonomousGenerationResponse {
  bool success = 1;
  string message = 2;
  string workflow_id = 3;
  string run_id = 4;
}

message TerminateAutonomousGenerationRequest {
  string workflow_id = 1;
  string reason = 2;
}

message TerminateAutonomousGenerationResponse {
  bool success = 1;
  string message = 2;
}

message InteractWithAIRequest {
  string file_path = 1;
  string episode_id = 2;
  string message = 3;
  repeated AIContext context = 4;
  string session_id = 5;
  string agent_mode = 6; // "general", "scenario", "episode", "character", "cinematic", "dialogue", "environment", "prop", "ghost"
  repeated ChatMessage history = 7; // Previous messages in the conversation
}

message AIContext {
  string type = 1; // "episode", "page", "panel", "character"
  string id = 2;
  int32 page_number = 3;
  int32 panel = 4;
  string json_content = 5; // Serialized data for the context item
}

message InteractWithAIResponse {
  bool success = 1;
  string message = 2;
  string ai_response = 3;
  repeated JSONPatch patches = 4; // Optional patches to apply to the storyboard
  ContextScope context_scope = 5; // For A2A mode: which context was loaded
  repeated string resolved_ids = 6; // IDs that were automatically resolved via MCP
}

message ContextScope {
  repeated string episodes = 1;
  repeated int32 pages = 2;
  repeated int32 panels = 3;
  repeated string characters = 4;
}

message JSONPatch {
  string op = 1; // "add", "remove", "replace"
  string path = 2;
  string value = 3; // JSON string value
}

message GenerateScenarioRequest {
  string file_path = 1;
  string prompt = 2;
  string context_jsonld = 3; // Optional additional context
}

message GenerateScenarioResponse {
  bool success = 1;
  string message = 2;
  string workflow_id = 3;
}

message GenerateEpisodeRequest {
  string file_path = 1;
  string episode_id = 2;
  string scenario_context = 3;
}

message GenerateEpisodeResponse {
  bool success = 1;
  string message = 2;
  string workflow_id = 3;
}

message RefineCharactersRequest {
  string file_path = 1;
  string episode_id = 2;
  repeated string character_ids = 3;
}

message RefineCharactersResponse {
  bool success = 1;
  string message = 2;
  string workflow_id = 3;
}

message GenerateCinematicSketchRequest {
  string file_path = 1;
  string episode_id = 2;
  int32 page_number = 3;
  int32 panel = 4;
}

message GenerateCinematicSketchResponse {
  bool success = 1;
  string message = 2;
  string workflow_id = 3;
}

message LoadStoryboardRequest {
  string file_path = 1; // Path to storyboard.jsonld file
}

message LoadStoryboardResponse {
  string jsonld_content = 1; // Full JSON-LD content
  StoryboardMetadata metadata = 2;
}

message StoryboardMetadata {
  string title = 1;
  string description = 2;
  repeated string episodes = 3; // Episode IDs
}

message UpdatePanelRequest {
  string file_path = 1;
  string episode_id = 2;
  int32 page_number = 3;
  int32 panel = 4;
  PanelData panel_data = 5;
  string session_id = 6; // Current client session ID
}

message PanelData {
  repeated string characters = 1; // Character IDs
  repeated Dialogue dialogue = 2;
  string environment = 3; // Environment ID
  string visual_note = 4; // Visual description/note
  string camera_direction = 5; // Camera instructions (e.g., "Followカメラ", "PAN スライド")
  float duration_seconds = 6; // Duration in seconds
  string cut_number = 7; // Cut number (e.g., "76", "77", "つづき")
  string shot = 8; // Shot type (e.g., "Close-up", "Wide Shot")
  string runway_prompt = 9; // Runway base prompt
  string generated_image_url = 10; // Generated image URL (base64 data URL or URL)
  string image_prompt = 11; // Prompt used for image generation
  repeated GeneratedImage generated_images = 12; // History of generated images
  int32 current_image_index = 13; // Current image index in history
  MangaLayout manga_layout = 14; // Manga layout information
}

message MangaLayout {
  repeated MangaPanelLayout panels = 1;
  repeated MangaText texts = 2; // Dialogue bubbles, SFX, etc.
}

message MangaPanelLayout {
  int32 panel_index = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  string shape = 6; // "rectangle", "trapezoid", etc.
  int32 z_index = 7;
  float image_x = 8; // Image offset X (%)
  float image_y = 9; // Image offset Y (%)
  float image_scale = 10; // Image scale (1.0 = 100%)
}

message MangaText {
  string text = 1;
  string type = 2; // "dialogue", "sfx", "thought", "narration"
  float x = 3;
  float y = 4;
  float font_size = 5;
  string style = 6; // "vertical", "horizontal", "bold", etc.
}

message GeneratedImage {
  string image_url = 1; // Image URL or path
  string image_prompt = 2; // Prompt used for generation
  int64 generated_at = 3; // Unix timestamp
  string model = 4; // Model used for generation
}

message Dialogue {
  string speaker = 1;
  string text = 2;
  MangaText manga_layout = 3;
  // --- Optional directing / acting metadata (stored as gh:* fields in JSON-LD) ---
  string delivery = 4; // how to say it (actor direction)
  string subtext = 5; // what they really mean
  string emotion = 6; // coarse emotion label
  int32 pause_before_ms = 7;
  int32 pause_after_ms = 8;
}

message GenerateDialogueRequest {
  string file_path = 1;
  string episode_id = 2;
  int32 page_number = 3;
  int32 panel = 4;
  PanelData panel_data = 5; // current panel data (seed)
  int32 max_lines = 6; // optional hint (0 = auto)
  string style = 7; // e.g. "cinematic drama, Japanese"
  bool strict_known_facts = 8; // disallow new facts not in prior context
}

message GenerateDialogueResponse {
  bool success = 1;
  string message = 2;
  repeated Dialogue dialogue = 3;
  string model = 4;
}

message UpdatePanelResponse {
  bool success = 1;
  string message = 2;
}

message SaveStoryboardRequest {
  string file_path = 1;
  string jsonld_content = 2;
}

message SaveStoryboardResponse {
  bool success = 1;
  string message = 2;
}

message GetEpisodesRequest {
  string file_path = 1;
}

message GetEpisodesResponse {
  repeated Episode episodes = 1;
}

message GetArcsRequest {
  string file_path = 1;
}

message GetArcsResponse {
  repeated Arc arcs = 1;
}

message Arc {
  string id = 1;
  string title = 2;
  repeated string episode_ids = 3;
  string description = 4;
}

message Episode {
  string id = 1;
  string title = 2;
  int32 total_pages = 3;
}

message GetEpisodePanelsRequest {
  string file_path = 1;
  string episode_id = 2;
  int32 page_number = 3; // Optional: filter by page
}

message GetEpisodePanelsResponse {
  repeated Panel panels = 1;
}

message GetArcPanelsRequest {
  string file_path = 1;
  string arc_id = 2;
}

message GetArcPanelsResponse {
  repeated Panel panels = 1;
}

message Panel {
  int32 page_number = 1;
  int32 panel = 2;
  string cut_number = 3;
  PanelData data = 4;
}

message StreamUpdatesRequest {
  string file_path = 1;
  string session_id = 2;
}

message StreamUpdatesResponse {
  string update_type = 1; // "panel_updated", "episode_added", "chat_message", "job_progress", "job_completed", "job_failed", "job_cancelled"
  string episode_id = 2;
  int32 page_number = 3;
  int32 panel = 4;
  string jsonld_patch = 5; // JSON Patch format (optional)
  PanelData panel_data = 6; // Full panel data for direct update
  string sender_session_id = 7; // ID of the client who made the change
  ChatMessage chat_message = 8; // For A2A conversation display
  // Job progress fields (for update_type "job_*")
  string job_id = 9;
  string job_status = 10; // "queued", "running", "completed", "failed", "cancelled"
  int32 job_current_step = 11;
  int32 job_total_steps = 12;
  float job_eta_ms = 13;
  string job_error = 14;
  string job_image_url = 15;
}

message ChatMessage {
  string role = 1; // "user", "assistant", "system", "debug", "error"
  string agent_mode = 2; // "scenario", "episode", etc.
  string content = 3;
  string context_json = 4; // Serialized context items
  repeated string resolved_ids = 5; // IDs resolved via MCP
  repeated JSONPatch patches = 6; // Patches suggested in this message
  ContextScope context_scope = 7; // Context scope identified in this message
}

message SaveChatSessionRequest {
  string file_path = 1;
  ChatSessionData session = 2;
}

message SaveChatSessionResponse {
  bool success = 1;
  string message = 2;
}

message GetChatSessionsRequest {
  string file_path = 1;
}

message GetChatSessionsResponse {
  repeated ChatSessionData sessions = 1;
}

message ChatSessionData {
  string id = 1;
  string title = 2;
  int64 timestamp = 3;
  repeated ChatMessage messages = 4;
}

message GeneratePanelImageRequest {
  string file_path = 1;
  string episode_id = 2;
  int32 page_number = 3;
  int32 panel = 4;
  PanelData panel_data = 5; // Panel data for prompt generation
  string model = 6; // Model to use: "openrouter" (default) or "local" (AnimagineXL 4.0)
}

message GeneratePanelImageResponse {
  bool success = 1;
  string message = 2;
  GeneratedImage generated_image = 3;
  string image_url = 4; // URL to access the saved image
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
  string active_project = 2; // Currently active project directory name
}

message Project {
  string id = 1; // Directory name (e.g., "260123-jump")
  string name = 2; // Display name (e.g., "Ghost Hacker")
  bool has_storyboard = 3; // Whether resources/storyboard.jsonld exists
}

message SwitchProjectRequest {
  string project_id = 1; // Directory name to switch to
}

message SwitchProjectResponse {
  bool success = 1;
  string message = 2;
  string storyboard_path = 3;
}

// --- Image Generation Job Queue Messages ---

message SubmitGenerationJobRequest {
  string file_path = 1;
  string episode_id = 2;
  int32 page_number = 3;
  int32 panel = 4;
  PanelData panel_data = 5;
  string model = 6; // "openrouter" or "local"
}

message SubmitGenerationJobResponse {
  bool success = 1;
  string message = 2;
  string job_id = 3;
}

message CancelGenerationJobRequest {
  string job_id = 1;
}

message CancelGenerationJobResponse {
  bool success = 1;
  string message = 2;
}

message ListGenerationJobsRequest {}

message ListGenerationJobsResponse {
  repeated GenerationJobInfo jobs = 1;
}

message GenerationJobInfo {
  string job_id = 1;
  string status = 2; // "queued", "running", "completed", "failed", "cancelled"
  int32 current_step = 3;
  int32 total_steps = 4;
  float estimated_remaining_ms = 5;
  string error = 6;
  string image_url = 7;
  string episode_id = 8;
  int32 page_number = 9;
  int32 panel = 10;
  string model = 11;
}
