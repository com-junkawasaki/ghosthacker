syntax = "proto3";

package gftd.ghosthacker.zeneditor.v1;

option go_package = "github.com/gftd-ai/ghost-hacker/apps/zen-editor/backend/proto;editorpb";

service EditorService {
  rpc GetTopology(GetTopologyRequest) returns (GetTopologyResponse);
  rpc GetBlocks(GetBlocksRequest) returns (GetBlocksResponse);
  rpc SaveManuscript(SaveManuscriptRequest) returns (SaveManuscriptResponse);
  rpc GetProjectMetadata(GetProjectMetadataRequest) returns (GetProjectMetadataResponse);
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
  
  // Storyboard persistence
  rpc SaveStoryboard(SaveStoryboardRequest) returns (SaveStoryboardResponse);
  rpc GetStoryboard(GetStoryboardRequest) returns (GetStoryboardResponse);

  // History & Branching
  rpc CommitHistory(CommitHistoryRequest) returns (CommitHistoryResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  rpc CheckoutHistory(CheckoutHistoryRequest) returns (CheckoutHistoryResponse);

  // Real-time Chat/Interaction Stream (A2A support)
  rpc Interact(InteractRequest) returns (stream InteractResponse);
}

message CommitHistoryRequest {
  string project_id = 1;
  string type = 2; // "storyboard", "graph"
  string state_json = 3;
  string message = 4;
  string branch_name = 5;
  string parent_id = 6;
}

message CommitHistoryResponse {
  string id = 1;
  bool success = 2;
}

message GetHistoryRequest {
  string project_id = 1;
  string branch_name = 2;
}

message GetHistoryResponse {
  repeated HistoryItem items = 1;
}

message HistoryItem {
  string id = 1;
  string type = 2;
  string state_json = 3;
  string message = 4;
  string branch_name = 5;
  string parent_id = 6;
  string created_at = 7;
}

message CheckoutHistoryRequest {
  string history_id = 1;
}

message CheckoutHistoryResponse {
  bool success = 1;
  string state_json = 2;
  string type = 3;
}

message SaveStoryboardRequest {
  string project_id = 1;
  repeated StoryboardScene scenes = 2;
}

message SaveStoryboardResponse {
  bool success = 1;
  string message = 2;
}

message GetStoryboardRequest {
  string project_id = 1;
}

message GetStoryboardResponse {
  repeated StoryboardScene scenes = 1;
}

message StoryboardScene {
  int32 id = 1;
  string visual = 2;
  string description = 3;
  string audio = 4;
  string timing = 5;
  int32 fps = 6;
  repeated string persons = 7;
  repeated string places = 8;
  repeated string items = 9;
  repeated string emotions = 10;
}

message InteractRequest {
  string session_id = 1;
  string project_id = 2;
  repeated string node_ids = 3; // Participating nodes (Characters, Environment, etc.)
  string user_message = 4;
  map<string, float> emotion_bias = 5; // Optional manual override or base bias
}

message InteractResponse {
  string node_id = 1;      // Which node is responding
  string node_name = 2;
  string message = 3;
  map<string, float> emotion_vector = 4; // Current emotional state of the responding node
}

message CallToolRequest {
  string name = 1;
  string arguments_json = 2; // JSON string of arguments
}

message CallToolResponse {
  string result_json = 1;    // JSON string of result
  bool is_error = 2;
}

message GetProjectMetadataRequest {
  string project_id = 1;
}

message GetProjectMetadataResponse {
  string title = 1;
  string description = 2;
  repeated Episode episodes = 3;
}

message Episode {
  string id = 1;
  string title = 2;
  repeated string files = 3;
}

message OpenFileRequest {
  string path = 1;
}

message OpenFileResponse {
  string content = 1;
}

message SaveFileRequest {
  string path = 1;
  string content = 2;
}

message SaveFileResponse {
  bool success = 1;
}

message AnalyzeTextRequest {
  string text = 1;
}

message AnalyzeTextResponse {
  string summary = 1;
  repeated Entity entities = 2;
}

message GetTopologyRequest {
  string project_id = 1;
}

message GetTopologyResponse {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
}

message GetBlocksRequest {
  string project_id = 1;
  string manuscript_id = 2;
}

message GetBlocksResponse {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
}

message SaveManuscriptRequest {
  string project_id = 1;
  string manuscript_id = 2;
  repeated Node blocks = 3;
}

message SaveManuscriptResponse {
  bool success = 1;
  string message = 2;
}

message Entity {
  string id = 1;
  string type = 2;
  string name = 3;
}

message Node {
  string id = 1;
  string label = 2;
  string type = 3;
  float x = 4;
  float y = 5;
  string content = 6;
  string group = 7; // "entity", "content", "concept", "link-node"
  repeated float embedding = 8; // LLM-like vector for distance-based layout
  map<string, string> localized_content = 9; // "ja" -> "...", "en" -> "..."
  string view_type = 10; // Explicit view hint: "storyboard", "editor", "translation", "entity", "asset"
}

message Edge {
  string from_id = 1;
  string to_id = 2;
  string relation = 3;
  string color = 4;
  string style = 5;
  float strength = 6; // 0.0 - 1.0
  string group = 7;    // "structural", "semantic", "causal", "thematic"
  float distance = 8; // Preferred distance based on vector similarity
}
