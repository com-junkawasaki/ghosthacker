syntax = "proto3";

package gftd.ghosthacker.zeneditor.v1;

option go_package = "github.com/gftd-ai/ghost-hacker/apps/zen-editor/backend/proto;editorpb";

service EditorService {
  rpc GetTopology(GetTopologyRequest) returns (GetTopologyResponse);
  rpc GetProjectMetadata(GetProjectMetadataRequest) returns (GetProjectMetadataResponse);
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
  
  // Real-time Chat/Interaction Stream (A2A support)
  rpc Interact(stream InteractRequest) returns (stream InteractResponse);
}

message InteractRequest {
  string session_id = 1;
  repeated string node_ids = 2; // Participating nodes (Characters, Environment, etc.)
  string user_message = 3;
  map<string, float> emotion_bias = 4; // Optional manual override or base bias
}

message InteractResponse {
  string node_id = 1;      // Which node is responding
  string node_name = 2;
  string message = 3;
  map<string, float> emotion_vector = 4; // Current emotional state of the responding node
}

message CallToolRequest {
  string name = 1;
  string arguments_json = 2; // JSON string of arguments
}

message CallToolResponse {
  string result_json = 1;    // JSON string of result
  bool is_error = 2;
}

message GetProjectMetadataRequest {
  string project_id = 1;
}

message GetProjectMetadataResponse {
  string title = 1;
  string description = 2;
  repeated Episode episodes = 3;
}

message Episode {
  string id = 1;
  string title = 2;
  repeated string files = 3;
}

message OpenFileRequest {
  string path = 1;
}

message OpenFileResponse {
  string content = 1;
}

message SaveFileRequest {
  string path = 1;
  string content = 2;
}

message SaveFileResponse {
  bool success = 1;
}

message AnalyzeTextRequest {
  string text = 1;
}

message AnalyzeTextResponse {
  string summary = 1;
  repeated Entity entities = 2;
}

message GetTopologyRequest {
  string project_id = 1;
}

message GetTopologyResponse {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
}

message Entity {
  string id = 1;
  string type = 2;
  string name = 3;
}

message Node {
  string id = 1;
  string label = 2;
  string type = 3;
  float x = 4;
  float y = 5;
}

message Edge {
  string from_id = 1;
  string to_id = 2;
  string relation = 3;
}

