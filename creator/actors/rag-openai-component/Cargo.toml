[package]
name = "rag-openai-component"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
wasmcloud-interface-httpserver = "0.12"

# Use the existing library code
rag-openai = { path = "../rag-openai" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true