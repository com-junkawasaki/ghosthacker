
services:
  postgres:
    image: postgres:16-alpine
    container_name: ghosthacker-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ghosthacker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  grpc:
    build:
      context: ./producer_anime
      dockerfile: Dockerfile.grpc
    container_name: ghosthacker-grpc
    ports:
      - "50051:50051"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - OPENAI_API_KEY=
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ghosthacker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 10s
      timeout: 5s
      retries: 5

  producer:
    build:
      context: ./producer_anime
      dockerfile: Dockerfile.dev
    container_name: ghosthacker-producer
    ports:
      - "3000:3000"
    environment:
      # Database
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      # gRPC API
      - NEXT_PUBLIC_GRPC_API_URL=http://localhost:50051
      - GRPC_API_URL=grpc:50051
      # Next.js App
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NODE_ENV=development
      # Improve file watching reliability on macOS bind mounts
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      # AI APIs (optional)
      - OPENAI_API_KEY=
      # Clerk Authentication (開発用のプレースホルダー)
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ZW5vdWdoLWNoaXBtdW5rLTkyLmNsZXJrLmFjY291bnRzLmRldiQ
      - CLERK_SECRET_KEY=sk_test_FmPI35dNxAij0tuaX7rV5PDIDVmVvx8J11nyVyxEGu
    depends_on:
      postgres:
        condition: service_healthy
      grpc:
        condition: service_healthy
    networks:
      - ghosthacker-network
    restart: unless-stopped
    volumes:
      - ./producer_anime:/app
      - /app/performers/actors/content-creator/node_modules
      - /app/.next
    working_dir: /app/performers/actors/content-creator

