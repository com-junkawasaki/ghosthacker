
services:
  postgres:
    image: postgres:16-alpine
    container_name: ghosthacker-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ghosthacker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  graphql:
    build:
      context: ./producer/performers/services/graphql
      dockerfile: Dockerfile.dev
    container_name: ghosthacker-graphql
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - NEXT_PUBLIC_GRAPHQL_API_URL=http://localhost:8081/graphql
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ghosthacker-network
    restart: unless-stopped
    volumes:
      - ./producer/performers/services/graphql:/app
      - graphql_target:/app/target
    working_dir: /app
    command: cargo run

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile.dev
    container_name: ghosthacker-producer
    ports:
      - "1016:1016"
    environment:
      # Database
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - SUPABASE_URL=http://localhost:54321
      - SUPABASE_SERVICE_ROLE_KEY=your-service-role-key
      # GraphQL API
      - NEXT_PUBLIC_GRAPHQL_API_URL=http://localhost:8081/graphql
      # Next.js App
      - NEXT_PUBLIC_APP_URL=http://localhost:1016
      # AI APIs (optional)
      - OPENROUTER_API_KEY=
      - OPENAI_API_KEY=
      - SORA_API_KEY=
      # YouTube (optional)
      - YOUTUBE_CLIENT_ID=
      - YOUTUBE_CLIENT_SECRET=
      # Hume AI
      - HUME_API=
      - HUME_API_KEY=
      - HUME_LANGUAGE_URL=https://api.hume.ai/v0/batch/jobs
      # Improve file watching reliability on macOS bind mounts
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
    depends_on:
      postgres:
        condition: service_healthy
      graphql:
        condition: service_started
    networks:
      - ghosthacker-network
    restart: unless-stopped
    volumes:
      - ./producer:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app

