version: '3.8'

services:
  neo4j:
    image: neo4j:5.23
    container_name: ghosthacker-neo4j
    ports:
      - "7475:7474"    # Neo4j Browser
      - "7688:7687"    # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/ghosthacker
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - ghosthacker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ghosthacker", "MATCH () RETURN count(*)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  ghosthacker-network:
    driver: bridge
