[workspace]
members = [
    "game-core",
    "game-bevy",
    "game-graphql",
    "game-ios",
    "game-android",
    "game-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ghost Hacker Team"]
license = "MIT"

[workspace.dependencies]
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
nanoid = "0.4"

