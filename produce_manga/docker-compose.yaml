services:
  postgres:
    image: postgres:16
    container_name: manga-editor-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manga-editor-network

  graphql:
    build:
      context: ./performers/services/graphql
      dockerfile: Dockerfile
      target: development
    container_name: manga-editor-graphql
    ports:
      - "25326:8080"
    environment:
      NODE_ENV: development
      # PostgreSQL Connection
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Server Configuration
      PORT: 8080
      HOST: 0.0.0.0
      # AI Service Configuration
      FAL_API_KEY: ${FAL_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY_251025: 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
      # Cargo watch configuration for HMR
      CARGO_WATCH_IGNORE: "target/**"
    volumes:
      - ./performers/services/graphql:/app
      - /app/target
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - manga-editor-network
    command: cargo watch -x "run --bin manga-editor-graphql" --ignore "target/**" --delay 0.5 --clear --watch-when-idle

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: manga-editor-frontend
    ports:
      - "25321:3000"
    environment:
      NODE_ENV: development
      CI: "true"
      # Improve file watching reliability on macOS bind mounts
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: 1000
      # Next.js HMR configuration
      FAST_REFRESH: "true"
      # App URLs (loaded from host env / .envrc)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:25321}
      # GraphQL API URL (Rust implementation)
      # Client-side: use localhost for browser access
      NEXT_PUBLIC_GRAPHQL_API_URL: ${NEXT_PUBLIC_GRAPHQL_API_URL:-http://localhost:25326/graphql}
      # Server-side: use container name for server-to-server communication
      GRAPHQL_API_URL: ${GRAPHQL_API_URL:-http://graphql:8080/graphql}
      # AI Service Configuration (hardcoded for development)
      NEXT_PUBLIC_FAL_API_KEY: ${NEXT_PUBLIC_FAL_API_KEY:-}
      NEXT_PUBLIC_DEEPINFRA_API_KEY: ${NEXT_PUBLIC_DEEPINFRA_API_KEY:-}
      NEXT_PUBLIC_OPENAI_API_KEY: ${NEXT_PUBLIC_OPENAI_API_KEY:-}
      NEXT_PUBLIC_OPENROUTER_API_KEY_251025: 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
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - graphql
    networks:
      - manga-editor-network
    command: sh -c "pnpm install && pnpm dev"

volumes:
  postgres-data:

networks:
  manga-editor-network:
    name: manga-editor-network
    driver: bridge

