[package]
name = "manga-editor-grpc"
version = "0.1.0"
edition = "2021"
default-run = "manga-editor-grpc"

[lib]
name = "manga_editor_grpc"
path = "src/lib.rs"

[[bin]]
name = "manga-editor-grpc"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
tower = "0.5"

[build-dependencies]
tonic-build = "0.12"

