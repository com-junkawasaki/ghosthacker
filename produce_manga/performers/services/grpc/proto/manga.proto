syntax = "proto3";

package manga_editor;

// Manga Editor gRPC Service
service MangaEditorService {
  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);
  
  // Project operations
  rpc GetProject(GetProjectRequest) returns (Project);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc UpdateProject(UpdateProjectRequest) returns (Project);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  
  // Script operations
  rpc GetScript(GetScriptRequest) returns (Script);
  rpc ListScripts(ListScriptsRequest) returns (ListScriptsResponse);
  rpc CreateScript(CreateScriptRequest) returns (Script);
  rpc UpdateScript(UpdateScriptRequest) returns (Script);
  
  // Page operations
  rpc GetPage(GetPageRequest) returns (Page);
  rpc ListPages(ListPagesRequest) returns (ListPagesResponse);
  rpc CreatePage(CreatePageRequest) returns (Page);
  rpc UpdatePage(UpdatePageRequest) returns (Page);
  
  // Panel operations
  rpc GetPanel(GetPanelRequest) returns (Panel);
  rpc ListPanels(ListPanelsRequest) returns (ListPanelsResponse);
  rpc CreatePanel(CreatePanelRequest) returns (Panel);
  rpc UpdatePanel(UpdatePanelRequest) returns (Panel);
  
  // AI operations
  rpc GenerateStory(GenerateStoryRequest) returns (GenerateStoryResponse);
  rpc GeneratePanelImages(GeneratePanelImagesRequest) returns (GeneratePanelImagesResponse);
  rpc ListAIModels(ListAIModelsRequest) returns (ListAIModelsResponse);
  
  // Generated images
  rpc ListGeneratedImages(ListGeneratedImagesRequest) returns (ListGeneratedImagesResponse);
}

// Common messages
message HealthRequest {}
message HealthResponse {
  string status = 1;
}

// Project messages
message Project {
  string id = 1;
  string title = 2;
  optional string description = 3;
  string created_at = 4;
  string updated_at = 5;
}

message GetProjectRequest {
  string id = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message CreateProjectRequest {
  string title = 1;
  optional string description = 2;
}

message UpdateProjectRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
}

message DeleteProjectRequest {
  string id = 1;
}

message DeleteProjectResponse {
  bool success = 1;
}

// Script messages
message Script {
  string id = 1;
  string project_id = 2;
  string script_id = 3;
  string title = 4;
  optional int32 page_count = 5;
  string script_data = 6; // JSON string
  string created_at = 7;
  string updated_at = 8;
}

message GetScriptRequest {
  string id = 1;
}

message ListScriptsRequest {
  string project_id = 1;
}

message ListScriptsResponse {
  repeated Script scripts = 1;
}

message CreateScriptRequest {
  string project_id = 1;
  string script_id = 2;
  string title = 3;
  optional int32 page_count = 4;
  string script_data = 5; // JSON string
}

message UpdateScriptRequest {
  string id = 1;
  optional string title = 2;
  optional int32 page_count = 3;
  optional string script_data = 4; // JSON string
}

// Page messages
message Page {
  string id = 1;
  string project_id = 2;
  string script_id = 3;
  string page_id = 4;
  optional string page_type = 5;
  optional string description = 6;
  optional int32 page_number = 7;
  int32 width = 8;
  int32 height = 9;
  optional string konva_stage_json = 10; // JSON string
  string created_at = 11;
  string updated_at = 12;
}

message GetPageRequest {
  string id = 1;
}

message ListPagesRequest {
  string script_id = 1;
}

message ListPagesResponse {
  repeated Page pages = 1;
}

message CreatePageRequest {
  string project_id = 1;
  string script_id = 2;
  string page_id = 3;
  optional string page_type = 4;
  optional string description = 5;
  optional int32 page_number = 6;
  optional int32 width = 7;
  optional int32 height = 8;
  optional string konva_stage_json = 9; // JSON string
}

message UpdatePageRequest {
  string id = 1;
  optional string page_type = 2;
  optional string description = 3;
  optional int32 page_number = 4;
  optional int32 width = 5;
  optional int32 height = 6;
  optional string konva_stage_json = 7; // JSON string
}

// Panel messages
message Dialogue {
  string speaker = 1;
  string text = 2;
}

message Panel {
  string id = 1;
  string project_id = 2;
  string page_id = 3;
  int32 panel_id = 4;
  optional string layout = 5;
  optional string visual = 6;
  repeated Dialogue dialogue = 7;
  optional int32 x = 8;
  optional int32 y = 9;
  optional int32 width = 10;
  optional int32 height = 11;
  int32 z_index = 12;
  optional string image_url = 13;
  optional string image_base64 = 14;
  optional string image_data = 15; // Base64 encoded bytea
  string panel_data = 16; // JSON string
  string created_at = 17;
  string updated_at = 18;
}

message GetPanelRequest {
  string id = 1;
}

message ListPanelsRequest {
  string page_id = 1;
}

message ListPanelsResponse {
  repeated Panel panels = 1;
}

message CreatePanelRequest {
  string project_id = 1;
  string page_id = 2;
  int32 panel_id = 3;
  optional string layout = 4;
  optional string visual = 5;
  repeated Dialogue dialogue = 6;
  optional int32 x = 7;
  optional int32 y = 8;
  optional int32 width = 9;
  optional int32 height = 10;
  optional int32 z_index = 11;
  optional string image_url = 12;
  optional string image_base64 = 13;
  string panel_data = 14; // JSON string
}

message UpdatePanelRequest {
  string id = 1;
  optional string layout = 2;
  optional string visual = 3;
  repeated Dialogue dialogue = 4;
  optional int32 x = 5;
  optional int32 y = 6;
  optional int32 width = 7;
  optional int32 height = 8;
  optional int32 z_index = 9;
  optional string image_url = 10;
  optional string image_base64 = 11;
  optional string panel_data = 12; // JSON string
}

// AI operation messages
message GenerateStoryRequest {
  string project_id = 1;
  string story_prompt = 2;
  optional bool continue_from_previous = 3;
  optional string preset = 4;
}

message GenerateStoryResponse {
  Script script = 1;
  repeated Page pages = 2;
}

message GeneratePanelImagesRequest {
  string project_id = 1;
  repeated string panel_ids = 2;
  string prompt = 3;
  optional string negative_prompt = 4;
  string provider = 5;
  string model_id = 6;
  optional int32 width = 7;
  optional int32 height = 8;
}

message GeneratedImage {
  string id = 1;
  string project_id = 2;
  optional string panel_id = 3;
  string prompt = 4;
  optional string negative_prompt = 5;
  optional string image_url = 6;
  optional string image_base64 = 7;
  optional string image_data = 8; // Base64 encoded bytea
  string provider = 9;
  string model = 10;
  optional string model_id = 11;
  string created_at = 12;
}

message GeneratePanelImagesResponse {
  repeated GeneratedImage images = 1;
}

message AIModel {
  string id = 1;
  string provider = 2;
  string model_id = 3;
  string model_name = 4;
  string model_type = 5;
  optional string preview_image_url = 6;
  optional string description = 7;
  bool is_active = 8;
  string created_at = 9;
  string updated_at = 10;
}

message ListAIModelsRequest {
  optional string provider = 1;
}

message ListAIModelsResponse {
  repeated AIModel models = 1;
}

message ListGeneratedImagesRequest {
  string project_id = 1;
  optional string panel_id = 2;
}

message ListGeneratedImagesResponse {
  repeated GeneratedImage images = 1;
}

