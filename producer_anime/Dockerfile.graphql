FROM rustlang/rust:nightly-alpine AS builder

WORKDIR /app

# ビルドに必要な依存関係をインストール
RUN apk add --no-cache musl-dev openssl-dev

# GraphQLサービスディレクトリをコピー
COPY performers/services/graphql/ ./performers/services/graphql/

WORKDIR /app/performers/services/graphql

# ビルド
RUN cargo build --release

# ランタイムイメージ
FROM alpine:latest

RUN apk add --no-cache ca-certificates curl

WORKDIR /app

# ビルドしたバイナリをコピー
COPY --from=builder /app/performers/services/graphql/target/release/producerv2-graphql /app/producerv2-graphql

# マイグレーションファイルをコピー
COPY performers/services/graphql/migrations ./migrations

EXPOSE 8080

HEALTHCHECK --interval=10s --timeout=5s --retries=3 \
  CMD curl -f http://localhost:8080/health || exit 1

CMD ["/app/producerv2-graphql"]

