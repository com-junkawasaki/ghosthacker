services:
  postgres:
    image: postgres:16-alpine
    container_name: producerv2-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  graphql:
    build:
      context: .
      dockerfile: Dockerfile.graphql
    container_name: producerv2-graphql
    ports:
      - "8080:8080"
    environment:
      # PostgreSQL Database
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      RUST_LOG: debug
    command: ["/app/producerv2-graphql"]
    # volumes:
    #   - ./performers/services/graphql:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: producerv2-app
    ports:
      - "3000:3000"
    environment:
      # Node.js / Next.js
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: 1000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      
      # GraphQL API
      NEXT_PUBLIC_GRAPHQL_API_URL: http://localhost:8080/graphql
      GRAPHQL_API_URL: http://graphql:8080/graphql
      
      # Database
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      
      # Clerk Authentication (開発用のプレースホルダー)
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZW5vdWdoLWNoaXBtdW5rLTkyLmNsZXJrLmFjY291bnRzLmRldiQ
      CLERK_SECRET_KEY: sk_test_FmPI35dNxAij0tuaX7rV5PDIDVmVvx8J11nyVyxEGu
      
      # LLM Providers (開発用のプレースホルダー)
      OPENAI_API_KEY: sk-placeholder-openai-api-key
      ANTHROPIC_API_KEY: sk-ant-placeholder-anthropic-api-key
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      
      # Media Providers (開発用のプレースホルダー)
      HUME_API_KEY: placeholder-hume-api-key
      RUNWAYML_API_KEY: placeholder-runwayml-api-key
      
      # YouTube API (開発用のプレースホルダー)
      YOUTUBE_CLIENT_ID: placeholder-youtube-client-id
      YOUTUBE_CLIENT_SECRET: placeholder-youtube-client-secret
      YOUTUBE_REDIRECT_URI: http://localhost:3000/api/auth/youtube/callback
    volumes:
      - .:/app
      - /app/performers/actors/content-creator/node_modules
      - /app/.next
    depends_on:
      - postgres
      - graphql

volumes:
  postgres-data:

