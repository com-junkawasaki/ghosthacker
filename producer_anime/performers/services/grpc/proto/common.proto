syntax = "proto3";

package producer.common;


// 空のメッセージ（Delete等で使用）
message Empty {}

// エラーメッセージ
message Error {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// ページネーションリクエスト
message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
}

// ページネーションレスポンス
message PaginationResponse {
  int32 total = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_pages = 4;
}

