syntax = "proto3";

package producer;

import "common.proto";
import "google/protobuf/timestamp.proto";

// ==================== メッセージ定義 ====================

message Project {
  string id = 1;
  string name = 2;
  optional string author = 3;
  optional string description = 4;
  optional string status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Story {
  string id = 1;
  string title = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message Script {
  string id = 1;
  string script_text = 2;
  string derived_from_story = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Metadata {
  string id = 1;
  optional string title = 2;
  optional string author = 3;
  optional string isbn = 4;
  optional string language = 5;
  optional string publisher = 6;
  optional string date = 7;
  optional string description = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message EPUBDocument {
  string id = 1;
  string title = 2;
  optional string metadata_id = 3;
  optional string tiptap_content = 4; // JSON文字列
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message KindleDocument {
  string id = 1;
  string title = 2;
  optional string metadata_id = 3;
  optional string tiptap_content = 4; // JSON文字列
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Chapter {
  string id = 1;
  optional string epub_document_id = 2;
  optional string kindle_document_id = 3;
  string title = 4;
  int32 order = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Section {
  string id = 1;
  string chapter_id = 2;
  string title = 3;
  int32 order = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Paragraph {
  string id = 1;
  optional string chapter_id = 2;
  optional string section_id = 3;
  int32 order = 4;
  optional string style = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message TextNode {
  string id = 1;
  string paragraph_id = 2;
  string content = 3;
  int32 order = 4;
  optional string style = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ==================== リクエスト/レスポンス ====================

message GetProjectRequest {
  string id = 1;
}

message GetProjectResponse {
  optional Project project = 1;
}

message ListProjectsRequest {
  producer.common.PaginationRequest pagination = 1;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  producer.common.PaginationResponse pagination = 2;
}

message CreateProjectRequest {
  string name = 1;
  optional string description = 2;
}

message CreateProjectResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string status = 4;
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string id = 1;
}

message DeleteProjectResponse {
  bool success = 1;
}

message GetStoryRequest {
  string id = 1;
}

message GetStoryResponse {
  optional Story story = 1;
}

message ListStoriesRequest {
  producer.common.PaginationRequest pagination = 1;
}

message ListStoriesResponse {
  repeated Story stories = 1;
  producer.common.PaginationResponse pagination = 2;
}

message CreateStoryRequest {
  string title = 1;
  string content = 2;
}

message CreateStoryResponse {
  Story story = 1;
}

message UpdateStoryRequest {
  string id = 1;
  optional string title = 2;
  optional string content = 3;
}

message UpdateStoryResponse {
  Story story = 1;
}

message DeleteStoryRequest {
  string id = 1;
}

message DeleteStoryResponse {
  bool success = 1;
}

message GetScriptRequest {
  string id = 1;
}

message GetScriptResponse {
  optional Script script = 1;
}

message CreateScriptRequest {
  string script_text = 1;
  string derived_from_story = 2;
  string status = 3;
}

message CreateScriptResponse {
  Script script = 1;
}

message UpdateScriptRequest {
  string id = 1;
  optional string script_text = 2;
  optional string status = 3;
}

message UpdateScriptResponse {
  Script script = 1;
}

message DeleteScriptRequest {
  string id = 1;
}

message DeleteScriptResponse {
  bool success = 1;
}

message GetEPUBDocumentRequest {
  string id = 1;
}

message GetEPUBDocumentResponse {
  optional EPUBDocument document = 1;
}

message CreateEPUBDocumentRequest {
  string title = 1;
  optional string metadata_id = 2;
  optional string tiptap_content = 3;
}

message CreateEPUBDocumentResponse {
  EPUBDocument document = 1;
}

message UpdateEPUBDocumentRequest {
  string id = 1;
  optional string title = 2;
  optional string metadata_id = 3;
  optional string tiptap_content = 4;
}

message UpdateEPUBDocumentResponse {
  EPUBDocument document = 1;
}

message GetKindleDocumentRequest {
  string id = 1;
}

message GetKindleDocumentResponse {
  optional KindleDocument document = 1;
}

message GetChaptersRequest {
  string document_id = 1;
  bool is_epub = 2;
}

message GetChaptersResponse {
  repeated Chapter chapters = 1;
}

message CreateChapterRequest {
  optional string epub_document_id = 1;
  optional string kindle_document_id = 2;
  string title = 3;
  int32 order = 4;
}

message CreateChapterResponse {
  Chapter chapter = 1;
}

message UpdateChapterRequest {
  string id = 1;
  optional string title = 2;
  optional int32 order = 3;
}

message UpdateChapterResponse {
  Chapter chapter = 1;
}

message GetParagraphsRequest {
  optional string chapter_id = 1;
  optional string document_id = 2;
}

message GetParagraphsResponse {
  repeated Paragraph paragraphs = 1;
}

message CreateParagraphRequest {
  optional string chapter_id = 1;
  optional string section_id = 2;
  int32 order = 3;
  optional string style = 4;
}

message CreateParagraphResponse {
  Paragraph paragraph = 1;
}

message UpdateParagraphRequest {
  string id = 1;
  optional int32 order = 2;
  optional string style = 3;
}

message UpdateParagraphResponse {
  Paragraph paragraph = 1;
}

message GetTextNodesRequest {
  string paragraph_id = 1;
}

message GetTextNodesResponse {
  repeated TextNode text_nodes = 1;
}

message CreateTextNodeRequest {
  string paragraph_id = 1;
  string content = 2;
  int32 order = 3;
  optional string style = 4;
}

message CreateTextNodeResponse {
  TextNode text_node = 1;
}

message UpdateTextNodeRequest {
  string id = 1;
  optional string content = 2;
  optional int32 order = 3;
  optional string style = 4;
}

message UpdateTextNodeResponse {
  TextNode text_node = 1;
}

message DeleteTextNodeRequest {
  string id = 1;
}

message DeleteTextNodeResponse {
  bool success = 1;
}

// ==================== サービス定義 ====================

service ProjectService {
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
}

service StoryService {
  rpc GetStory(GetStoryRequest) returns (GetStoryResponse);
  rpc ListStories(ListStoriesRequest) returns (ListStoriesResponse);
  rpc CreateStory(CreateStoryRequest) returns (CreateStoryResponse);
  rpc UpdateStory(UpdateStoryRequest) returns (UpdateStoryResponse);
  rpc DeleteStory(DeleteStoryRequest) returns (DeleteStoryResponse);
}

service ScriptService {
  rpc GetScript(GetScriptRequest) returns (GetScriptResponse);
  rpc CreateScript(CreateScriptRequest) returns (CreateScriptResponse);
  rpc UpdateScript(UpdateScriptRequest) returns (UpdateScriptResponse);
  rpc DeleteScript(DeleteScriptRequest) returns (DeleteScriptResponse);
}

service DocumentService {
  rpc GetEPUBDocument(GetEPUBDocumentRequest) returns (GetEPUBDocumentResponse);
  rpc CreateEPUBDocument(CreateEPUBDocumentRequest) returns (CreateEPUBDocumentResponse);
  rpc UpdateEPUBDocument(UpdateEPUBDocumentRequest) returns (UpdateEPUBDocumentResponse);
  rpc GetKindleDocument(GetKindleDocumentRequest) returns (GetKindleDocumentResponse);
  rpc GetChapters(GetChaptersRequest) returns (GetChaptersResponse);
  rpc CreateChapter(CreateChapterRequest) returns (CreateChapterResponse);
  rpc UpdateChapter(UpdateChapterRequest) returns (UpdateChapterResponse);
  rpc GetParagraphs(GetParagraphsRequest) returns (GetParagraphsResponse);
  rpc CreateParagraph(CreateParagraphRequest) returns (CreateParagraphResponse);
  rpc UpdateParagraph(UpdateParagraphRequest) returns (UpdateParagraphResponse);
  rpc GetTextNodes(GetTextNodesRequest) returns (GetTextNodesResponse);
  rpc CreateTextNode(CreateTextNodeRequest) returns (CreateTextNodeResponse);
  rpc UpdateTextNode(UpdateTextNodeRequest) returns (UpdateTextNodeResponse);
  rpc DeleteTextNode(DeleteTextNodeRequest) returns (DeleteTextNodeResponse);
}

