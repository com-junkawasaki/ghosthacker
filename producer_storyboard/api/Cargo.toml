[package]
name = "vercel-graphql-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "graphql-rust"
path = "graphql-rust.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
async-graphql = "7"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "rust_decimal"], default-features = false }
rust_decimal = { version = "1", features = ["serde-with-str", "db-postgres"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
vercel_runtime = "1"
storyboard-editor-graphql = { path = "../performers/services/graphql" }

