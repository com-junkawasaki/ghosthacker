{{- if .Values.temporalWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "producer-storyboard.fullname" . }}-temporal-worker
  labels:
    {{- include "producer-storyboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-worker
spec:
  replicas: {{ .Values.temporalWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "producer-storyboard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: temporal-worker
  template:
    metadata:
      labels:
        {{- include "producer-storyboard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-worker
    spec:
      containers:
      - name: temporal-worker
        image: "{{ .Values.temporalWorker.image.repository }}:{{ .Values.temporalWorker.image.tag }}"
        imagePullPolicy: {{ .Values.temporalWorker.image.pullPolicy }}
        env:
        - name: DATABASE_URL
          value: {{ .Values.temporalWorker.env.DATABASE_URL | quote }}
        - name: TEMPORAL_ADDRESS
          value: {{ .Values.temporalWorker.env.TEMPORAL_ADDRESS | quote }}
        {{- if .Values.temporalWorker.secrets.CLERK_SECRET_KEY }}
        - name: CLERK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "producer-storyboard.fullname" . }}-secrets
              key: clerk-secret-key
        {{- end }}
        resources:
          {{- toYaml .Values.temporalWorker.resources | nindent 10 }}
---
{{- end }}
