version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: internal/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-es
    out: ../../../src/lib/grpc/generated
    opt:
      - import_extension=none
      - target=ts
  - remote: buf.build/connectrpc/es
    out: ../../../src/lib/grpc/generated
    opt:
      - import_extension=none
      - target=ts

