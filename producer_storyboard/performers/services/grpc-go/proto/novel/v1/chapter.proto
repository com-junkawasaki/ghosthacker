syntax = "proto3";

package novel.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/novel/v1;novelv1";

// Chapter represents a chapter within a novel project
message Chapter {
  string id = 1;
  string novel_project_id = 2;
  string title = 3;
  int32 order_index = 4;
  optional string content_html = 5;
  optional string content_json = 6; // Tiptap JSON format
  string created_at = 7;
  string updated_at = 8;
}

message ListChaptersRequest {
  string novel_project_id = 1;
}

message ListChaptersResponse {
  repeated Chapter chapters = 1;
}

message GetChapterRequest {
  string id = 1;
}

message CreateChapterRequest {
  string novel_project_id = 1;
  string title = 2;
  optional int32 order_index = 3;
}

message UpdateChapterRequest {
  string id = 1;
  optional string title = 2;
  optional int32 order_index = 3;
  optional string content_html = 4;
  optional string content_json = 5;
}

message DeleteChapterRequest {
  string id = 1;
}

message DeleteChapterResponse {
  bool success = 1;
}

message GetChapterContentRequest {
  string id = 1;
}

message GetChapterContentResponse {
  optional string content_html = 1;
  optional string content_json = 2;
}

message UpdateChapterContentRequest {
  string id = 1;
  optional string content_html = 2;
  optional string content_json = 3;
}

message UpdateChapterContentResponse {
  bool success = 1;
}
