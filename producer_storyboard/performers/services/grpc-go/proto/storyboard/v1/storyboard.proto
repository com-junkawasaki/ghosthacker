syntax = "proto3";

package storyboard.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/storyboard/v1;storyboardv1";

// Storyboard represents a storyboard within a project
message Storyboard {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string aspect_ratio = 4;
  string resolution = 5;
  optional int32 duration_seconds = 6;
  int32 num_variations = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListStoryboardsRequest {
  string project_id = 1;
}

message ListStoryboardsResponse {
  repeated Storyboard storyboards = 1;
}

message GetStoryboardRequest {
  string id = 1;
}

message CreateStoryboardRequest {
  string project_id = 1;
  string title = 2;
  optional string aspect_ratio = 3;
  optional string resolution = 4;
  optional int32 duration_seconds = 5;
  optional int32 num_variations = 6;
}

message UpdateStoryboardRequest {
  string id = 1;
  optional string title = 2;
  optional string aspect_ratio = 3;
  optional string resolution = 4;
  optional int32 duration_seconds = 5;
  optional int32 num_variations = 6;
}

message DeleteStoryboardRequest {
  string id = 1;
}

message DeleteStoryboardResponse {
  bool success = 1;
}
