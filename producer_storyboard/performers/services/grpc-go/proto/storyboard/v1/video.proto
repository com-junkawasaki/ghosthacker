syntax = "proto3";

package storyboard.v1;

option go_package = "github.com/gftd/producer-storyboard/performers/services/grpc-go/internal/gen/storyboard/v1;storyboardv1";

// VideoGenerationProvider defines the AI provider for video generation
enum VideoGenerationProvider {
  VIDEO_GENERATION_PROVIDER_UNSPECIFIED = 0;
  VIDEO_GENERATION_PROVIDER_OPENAI = 1;
  VIDEO_GENERATION_PROVIDER_RUNWAY = 2;
}

// GeneratedVideo represents a generated video record
message GeneratedVideo {
  string id = 1;
  string storyboard_id = 2;
  int32 variation_number = 3;
  optional string video_url = 4;
  string status = 5;
  optional string error_message = 6;
  string created_at = 7;
  VideoGenerationProvider provider = 8;
  optional string model = 9;
  optional int32 duration = 10;
  optional string runway_task_id = 11;
}

// GenerateVideoRequest - Request to generate a video
message GenerateVideoRequest {
  string storyboard_id = 1;
  int32 variation_number = 2;
  VideoGenerationProvider provider = 3;
  VideoGenerationParams params = 4;
}

// VideoGenerationParams - Parameters for video generation
message VideoGenerationParams {
  oneof params {
    OpenAIVideoParams openai = 1;
    RunwayVideoParams runway = 2;
  }
}

// OpenAIVideoParams - Parameters specific to OpenAI video generation
message OpenAIVideoParams {
  string prompt = 1;
  optional string model = 2;
}

// RunwayVideoParams - Parameters specific to Runway ML video generation
message RunwayVideoParams {
  string prompt_text = 1;
  optional string prompt_image_url = 2; // URL or base64
  optional string model = 3; // "gen3a_turbo" or "gen3a"
  optional int32 duration = 4; // 5 or 10 seconds
  optional string aspect_ratio = 5; // "16:9", "9:16", "1:1"
  optional int32 seed = 6;
}

// GenerateVideoResponse - Response from video generation request
message GenerateVideoResponse {
  string id = 1;
  string task_id = 2;
  string status = 3;
  VideoGenerationProvider provider = 4;
}

// GetVideoTaskStatusRequest - Request to check video generation status
message GetVideoTaskStatusRequest {
  string task_id = 1;
  VideoGenerationProvider provider = 2;
}

// GetVideoTaskStatusResponse - Response with video generation status
message GetVideoTaskStatusResponse {
  string task_id = 1;
  string status = 2; // "pending", "processing", "completed", "failed"
  repeated string video_urls = 3;
  optional string error_message = 4;
  optional bytes video_data = 5;
}

// ListGeneratedVideosRequest - Request to list generated videos
message ListGeneratedVideosRequest {
  string storyboard_id = 1;
}

// ListGeneratedVideosResponse - Response with list of generated videos
message ListGeneratedVideosResponse {
  repeated GeneratedVideo videos = 1;
}

// GetGeneratedVideoRequest - Request to get a specific generated video
message GetGeneratedVideoRequest {
  string id = 1;
}

// DeleteGeneratedVideoRequest - Request to delete a generated video
message DeleteGeneratedVideoRequest {
  string id = 1;
}

// DeleteGeneratedVideoResponse - Response from delete operation
message DeleteGeneratedVideoResponse {
  bool success = 1;
}

