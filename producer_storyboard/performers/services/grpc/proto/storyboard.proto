syntax = "proto3";

package storyboard_editor;

// Storyboard Editor gRPC Service
service StoryboardEditorService {
  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);
  
  // Project operations
  rpc GetProject(GetProjectRequest) returns (Project);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc UpdateProject(UpdateProjectRequest) returns (Project);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  
  // Storyboard operations
  rpc GetStoryboard(GetStoryboardRequest) returns (Storyboard);
  rpc ListStoryboards(ListStoryboardsRequest) returns (ListStoryboardsResponse);
  rpc CreateStoryboard(CreateStoryboardRequest) returns (Storyboard);
  rpc UpdateStoryboard(UpdateStoryboardRequest) returns (Storyboard);
  rpc DeleteStoryboard(DeleteStoryboardRequest) returns (DeleteStoryboardResponse);
  
  // Scene operations
  rpc GetScene(GetSceneRequest) returns (Scene);
  rpc ListScenes(ListScenesRequest) returns (ListScenesResponse);
  rpc CreateScene(CreateSceneRequest) returns (Scene);
  rpc UpdateScene(UpdateSceneRequest) returns (Scene);
  rpc DeleteScene(DeleteSceneRequest) returns (DeleteSceneResponse);
  
  // Video generation
  rpc GenerateVideo(GenerateVideoRequest) returns (GenerateVideoResponse);
  rpc GetVideoStatus(GetVideoStatusRequest) returns (VideoStatus);
  rpc ListGeneratedVideos(ListGeneratedVideosRequest) returns (ListGeneratedVideosResponse);
}

// Common messages
message HealthRequest {}
message HealthResponse {
  string status = 1;
}

// Project messages
message Project {
  string id = 1;
  string title = 2;
  optional string description = 3;
  string created_at = 4;
  string updated_at = 5;
}

message GetProjectRequest {
  string id = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message CreateProjectRequest {
  string title = 1;
  optional string description = 2;
}

message UpdateProjectRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
}

message DeleteProjectRequest {
  string id = 1;
}

message DeleteProjectResponse {
  bool success = 1;
}

// Storyboard messages
message Storyboard {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string aspect_ratio = 4;
  string resolution = 5;
  optional int32 duration_seconds = 6;
  int32 num_variations = 7;
  string storyboard_data = 8; // JSON string
  string created_at = 9;
  string updated_at = 10;
}

message GetStoryboardRequest {
  string id = 1;
}

message ListStoryboardsRequest {
  string project_id = 1;
}

message ListStoryboardsResponse {
  repeated Storyboard storyboards = 1;
}

message CreateStoryboardRequest {
  string project_id = 1;
  string title = 2;
  optional string aspect_ratio = 3;
  optional string resolution = 4;
  optional int32 duration_seconds = 5;
  optional int32 num_variations = 6;
  optional string storyboard_data = 7; // JSON string
}

message UpdateStoryboardRequest {
  string id = 1;
  optional string title = 2;
  optional string aspect_ratio = 3;
  optional string resolution = 4;
  optional int32 duration_seconds = 5;
  optional int32 num_variations = 6;
  optional string storyboard_data = 7; // JSON string
}

message DeleteStoryboardRequest {
  string id = 1;
}

message DeleteStoryboardResponse {
  bool success = 1;
}

// Scene messages
message Scene {
  string id = 1;
  string storyboard_id = 2;
  int32 scene_number = 3;
  optional string text_description = 4;
  optional string media_type = 5; // 'video', 'image', 'text'
  optional string media_url = 6;
  optional string media_data = 7; // Base64 encoded bytea
  optional double start_time_seconds = 8;
  optional double duration_seconds = 9;
  optional string transition_type = 10; // 'cut', 'fade', 'dissolve'
  optional string scene_data = 11; // JSON string
  string created_at = 12;
  string updated_at = 13;
}

message GetSceneRequest {
  string id = 1;
}

message ListScenesRequest {
  string storyboard_id = 1;
}

message ListScenesResponse {
  repeated Scene scenes = 1;
}

message CreateSceneRequest {
  string storyboard_id = 1;
  int32 scene_number = 2;
  optional string text_description = 3;
  optional string media_type = 4;
  optional string media_url = 5;
  optional string media_data = 6; // Base64 encoded bytea
  optional double start_time_seconds = 7;
  optional double duration_seconds = 8;
  optional string transition_type = 9;
  optional string scene_data = 10; // JSON string
}

message UpdateSceneRequest {
  string id = 1;
  optional int32 scene_number = 2;
  optional string text_description = 3;
  optional string media_type = 4;
  optional string media_url = 5;
  optional string media_data = 6; // Base64 encoded bytea
  optional double start_time_seconds = 7;
  optional double duration_seconds = 8;
  optional string transition_type = 9;
  optional string scene_data = 10; // JSON string
}

message DeleteSceneRequest {
  string id = 1;
}

message DeleteSceneResponse {
  bool success = 1;
}

// Video generation messages
message GenerateVideoRequest {
  string storyboard_id = 1;
  optional int32 variation_number = 2;
}

message GenerateVideoResponse {
  string video_id = 1;
  string status = 2; // 'pending', 'processing', 'completed', 'failed'
  optional string openai_job_id = 3;
  optional string error_message = 4;
}

message GetVideoStatusRequest {
  string video_id = 1;
}

message VideoStatus {
  string id = 1;
  string storyboard_id = 2;
  int32 variation_number = 3;
  optional string video_url = 4;
  optional string video_data = 5; // Base64 encoded bytea
  string status = 6; // 'pending', 'processing', 'completed', 'failed'
  optional string openai_job_id = 7;
  optional string error_message = 8;
  string created_at = 9;
  string updated_at = 10;
}

message ListGeneratedVideosRequest {
  string storyboard_id = 1;
}

message ListGeneratedVideosResponse {
  repeated VideoStatus videos = 1;
}
