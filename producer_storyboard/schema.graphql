# GraphQL Schema for Storyboard Editor
# This file should be generated from the backend GraphQL schema
# For now, it's a placeholder that matches the expected structure

type Project {
	id: ID!
	title: String!
	description: String
	createdAt: String!
	updatedAt: String!
}

type Storyboard {
	id: ID!
	projectId: ID!
	title: String!
	aspectRatio: String!
	resolution: String!
	durationSeconds: Int
	numVariations: Int!
	createdAt: String!
	updatedAt: String!
}

type Scene {
	id: ID!
	storyboardId: ID!
	sceneNumber: Int!
	textDescription: String
	mediaType: String
	mediaUrl: String
	startTimeSeconds: Float
	durationSeconds: Float
	transitionType: String
	createdAt: String!
	updatedAt: String!
}

type VideoStatus {
	id: ID!
	storyboardId: ID!
	variationNumber: Int!
	videoUrl: String
	status: String!
	errorMessage: String
	createdAt: String!
}

type GeneratedImage {
	id: ID!
	sceneId: ID!
	openaiImageId: String
	imageFormat: String
	imageType: String
	prompt: String
	model: String
	createdAt: String!
}

type OperationHistory {
	id: ID!
	entityType: String!
	entityId: ID!
	operationType: String!
	operationData: String!
	userId: ID
	createdAt: String!
}

type Query {
	projects: [Project!]!
	storyboards(projectId: ID!): [Storyboard!]!
	scenes(storyboardId: ID!): [Scene!]!
	scene(id: ID!): Scene
	generatedVideos(storyboardId: ID!): [VideoStatus!]!
	generatedImages(sceneId: ID!): [GeneratedImage!]!
	imageData(imageId: ID!): String!
	operationHistory(entityType: String, entityId: ID): [OperationHistory!]!
}

input CreateProjectInput {
	title: String!
	description: String
}

input CreateSceneInput {
	storyboardId: ID!
	sceneNumber: Int!
	textDescription: String
	durationSeconds: Float
	startTimeSeconds: Float
	transitionType: String
}

input UpdateSceneInput {
	id: ID!
	textDescription: String
	durationSeconds: Float
	startTimeSeconds: Float
	transitionType: String
}

input ReorderScenesInput {
	storyboardId: ID!
	sceneIds: [ID!]!
}

input GenerateSceneImageInput {
	sceneId: ID!
	prompt: String
	model: String
	imageType: String
}

type Mutation {
	createProject(input: CreateProjectInput!): Project!
	createScene(input: CreateSceneInput!): Scene!
	updateScene(input: UpdateSceneInput!): Scene!
	deleteScene(id: ID!): Boolean!
	reorderScenes(input: ReorderScenesInput!): [Scene!]!
	generateSceneImage(input: GenerateSceneImageInput!): GeneratedImage!
	generateVideo(storyboardId: ID!): VideoStatus!
}
