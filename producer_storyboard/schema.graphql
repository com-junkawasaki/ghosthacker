# GraphQL Schema for Storyboard Editor
# This file should be generated from the backend GraphQL schema
# For now, it's a placeholder that matches the expected structure

type Project {
	id: ID!
	orgId: ID!
	title: String!
	description: String
	createdAt: String!
	updatedAt: String!
}

type Storyboard {
	id: ID!
	projectId: ID!
	title: String!
	aspectRatio: String!
	resolution: String!
	durationSeconds: Int
	numVariations: Int!
	createdAt: String!
	updatedAt: String!
}

type Scene {
	id: ID!
	storyboardId: ID!
	sceneNumber: Int!
	textDescription: String
	mediaType: String
	mediaUrl: String
	startTimeSeconds: Float
	durationSeconds: Float
	transitionType: String
	createdAt: String!
	updatedAt: String!
}

type VideoStatus {
	id: ID!
	storyboardId: ID!
	variationNumber: Int!
	videoUrl: String
	status: String!
	errorMessage: String
	createdAt: String!
}

type GeneratedImage {
	id: ID!
	sceneId: ID!
	openaiImageId: String
	imageFormat: String
	imageType: String
	prompt: String
	model: String
	createdAt: String!
}

type OperationHistory {
	id: ID!
	entityType: String!
	entityId: ID!
	operationType: String!
	operationData: String!
	userId: ID
	createdAt: String!
}

type Character {
	id: ID!
	projectId: ID!
	name: String!
	description: String
	personality: String
	background: String
	defaultHumeVoiceId: String
	profileImageId: ID
	assets: [CharacterAsset!]!
	createdAt: String!
	updatedAt: String!
}

type CharacterAsset {
	id: ID!
	characterId: ID!
	assetType: String!
	assetFormat: String
	createdAt: String!
	updatedAt: String!
}

type Dialogue {
	id: ID!
	sceneId: ID!
	characterId: ID!
	language: String!
	text: String!
	translatedText: String
	humeVoiceId: String
	audioUrl: String
	startTimeSeconds: Float
	durationSeconds: Float
	orderIndex: Int!
	createdAt: String!
	updatedAt: String!
}

type Query {
	projects(orgId: ID!): [Project!]!
	storyboards(projectId: ID!): [Storyboard!]!
	scenes(storyboardId: ID!): [Scene!]!
	scene(id: ID!): Scene
	generatedVideos(storyboardId: ID!): [VideoStatus!]!
	generatedImages(sceneId: ID!): [GeneratedImage!]!
	imageData(imageId: ID!): String!
	operationHistory(entityType: String, entityId: ID): [OperationHistory!]!
	characters(projectId: ID!): [Character!]!
	dialogues(sceneId: ID!): [Dialogue!]!
	humeVoices: [HumeVoice!]!
	audioData(dialogueId: ID!): String!
	characterAssets(characterId: ID!): [CharacterAsset!]!
	characterAssetData(assetId: ID!): String!
	composers(projectId: ID!): [Composer!]!
	composer(id: ID!): Composer
	audioTracks(composerId: ID!): [AudioTrack!]!
	audioClips(trackId: ID!): [AudioClip!]!
	sunoMusic(composerId: ID!): [SunoMusic!]!
}

input CreateProjectInput {
	orgId: ID!
	title: String!
	description: String
}

input CreateStoryboardInput {
	projectId: ID!
	title: String
	aspectRatio: String
	resolution: String
}

input CreateSceneInput {
	storyboardId: ID!
	sceneNumber: Int!
	textDescription: String
	durationSeconds: Float
	startTimeSeconds: Float
	transitionType: String
}

input UpdateSceneInput {
	id: ID!
	textDescription: String
	durationSeconds: Float
	startTimeSeconds: Float
	transitionType: String
}

input ReorderScenesInput {
	storyboardId: ID!
	sceneIds: [ID!]!
}

input GenerateSceneImageInput {
	sceneId: ID!
	prompt: String
	model: String
	imageType: String
}

input UploadSceneImageInput {
	sceneId: ID!
	imageData: String! # Base64 encoded image data
	imageType: String # 'start', 'end', or 'uploaded'
	imageFormat: String # 'png', 'jpeg', 'webp'
}

input CreateCharacterInput {
	projectId: ID!
	name: String!
	description: String
	personality: String
	background: String
	defaultHumeVoiceId: String
	profileImageId: ID
}

input UpdateCharacterInput {
	id: ID!
	name: String
	description: String
	personality: String
	background: String
	defaultHumeVoiceId: String
	profileImageId: ID
}

input UploadCharacterAssetInput {
	characterId: ID!
	assetData: String!
	assetType: String!
	assetFormat: String
}

input CreateDialogueInput {
	sceneId: ID!
	characterId: ID!
	language: String!
	text: String!
	humeVoiceId: String
	startTimeSeconds: Float
	durationSeconds: Float
	orderIndex: Int
}

input UpdateDialogueInput {
	id: ID!
	language: String
	text: String
	humeVoiceId: String
	startTimeSeconds: Float
	durationSeconds: Float
	orderIndex: Int
}

input TranslateDialogueInput {
	dialogueId: ID!
	targetLanguage: String!
}

input CreateComposerInput {
	projectId: ID!
	title: String
}

input CreateAudioTrackInput {
	composerId: ID!
	trackNumber: Int!
	trackType: String!
	name: String
}

input CreateAudioClipInput {
	trackId: ID!
	startTimeSeconds: Float!
	durationSeconds: Float!
	audioType: String!
	audioUrl: String
	audioDataId: ID
	metadata: String
}

input GenerateSunoMusicInput {
	composerId: ID
	prompt: String!
	customMode: Boolean
	makeInstrumental: Boolean
	mv: String
}

input UpdateAudioClipInput {
	id: ID!
	startTimeSeconds: Float
	durationSeconds: Float
	trackId: ID
}

type HumeVoice {
	id: String!
	name: String!
	description: String
	language: String
}

type Composer {
	id: ID!
	projectId: ID!
	title: String!
	durationSeconds: Float
	createdAt: String!
	updatedAt: String!
}

type AudioTrack {
	id: ID!
	composerId: ID!
	trackNumber: Int!
	trackType: String!
	name: String
	createdAt: String!
	updatedAt: String!
}

type AudioClip {
	id: ID!
	trackId: ID!
	startTimeSeconds: Float!
	durationSeconds: Float!
	audioType: String!
	audioUrl: String
	audioDataId: ID
	metadata: String
	createdAt: String!
	updatedAt: String!
}

type SunoMusic {
	id: ID!
	composerId: ID
	prompt: String!
	status: String!
	audioUrl: String
	audioDataId: ID
	taskId: String
	createdAt: String!
	updatedAt: String!
}

type Mutation {
	createProject(input: CreateProjectInput!): Project!
	createStoryboard(input: CreateStoryboardInput!): Storyboard!
	createScene(input: CreateSceneInput!): Scene!
	updateScene(input: UpdateSceneInput!): Scene!
	deleteScene(id: ID!): Boolean!
	reorderScenes(input: ReorderScenesInput!): [Scene!]!
	generateSceneImage(input: GenerateSceneImageInput!): GeneratedImage!
	uploadSceneImage(input: UploadSceneImageInput!): GeneratedImage!
	generateVideo(storyboardId: ID!): VideoStatus!
	createCharacter(input: CreateCharacterInput!): Character!
	updateCharacter(input: UpdateCharacterInput!): Character!
	deleteCharacter(id: ID!): Boolean!
	uploadCharacterAsset(input: UploadCharacterAssetInput!): CharacterAsset!
	deleteCharacterAsset(assetId: ID!): Boolean!
	createDialogue(input: CreateDialogueInput!): Dialogue!
	updateDialogue(input: UpdateDialogueInput!): Dialogue!
	deleteDialogue(id: ID!): Boolean!
	translateDialogue(input: TranslateDialogueInput!): Dialogue!
	generateDialogueAudio(dialogueId: ID!): Dialogue!
	createComposer(input: CreateComposerInput!): Composer!
	createAudioTrack(input: CreateAudioTrackInput!): AudioTrack!
	createAudioClip(input: CreateAudioClipInput!): AudioClip!
	updateAudioClip(input: UpdateAudioClipInput!): AudioClip!
	deleteAudioClip(id: ID!): Boolean!
	generateSunoMusic(input: GenerateSunoMusicInput!): SunoMusic!
	reorderAudioClips(trackId: ID!, clipIds: [ID!]!): [AudioClip!]!
}
