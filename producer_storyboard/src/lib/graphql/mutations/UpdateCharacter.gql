mutation UpdateCharacter($input: UpdateCharacterInput!) {
	updateCharacter(input: $input) {
		id
		projectId
		name
		description
		personality
		background
		defaultHumeVoiceId
		profileImageId
		assets {
			id
			characterId
			assetType
			assetFormat
			createdAt
			updatedAt
		}
		createdAt
		updatedAt
	}
}

