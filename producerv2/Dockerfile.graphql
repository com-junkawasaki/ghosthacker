FROM rust:1.83-alpine AS builder

WORKDIR /app

# ビルドに必要な依存関係をインストール
RUN apk add --no-cache musl-dev openssl-dev

# GraphQLサービスディレクトリのみをコピー
COPY performers/services/graphql/Cargo.toml performers/services/graphql/Cargo.lock* ./
COPY performers/services/graphql/src ./src

WORKDIR /app

# ビルド
RUN cargo build --release

# ランタイムイメージ
FROM alpine:latest

RUN apk add --no-cache ca-certificates curl

WORKDIR /app

# ビルドしたバイナリをコピー
COPY --from=builder /app/performers/services/graphql/target/release/producerv2-graphql /app/producerv2-graphql

EXPOSE 8080

HEALTHCHECK --interval=10s --timeout=5s --retries=3 \
  CMD curl -f http://localhost:8080/health || exit 1

CMD ["/app/producerv2-graphql"]

