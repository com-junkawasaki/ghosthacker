version: '3.8'

services:
  terminusdb:
    image: terminusdb/terminusdb-server:latest
    container_name: producerv2-terminusdb
    ports:
      - "6363:6363"
    environment:
      TERMINUSDB_SERVER_PORT: 6363
      TERMINUSDB_SERVER_PASS: root
    volumes:
      - terminusdb-data:/app/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6363/"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: producerv2-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: producerv2-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: 1000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      TERMINUSDB_URL: http://terminusdb:6363
      TERMINUSDB_SERVER_PASS: root
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      terminusdb:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  terminusdb-data:
  postgres-data:

