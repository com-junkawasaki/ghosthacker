mutation CreateEPUBDocument($title: String!, $metadata: MetadataInput, $tiptapContent: JSON) {
  createEpubDocument(title: $title, metadata: $metadata, tiptapContent: $tiptapContent) {
    id
    title
    metadata
    chapters
    tiptapContent
    createdAt
    updatedAt
  }
}

mutation UpdateEPUBDocument($id: String!, $title: String, $metadata: MetadataInput, $tiptapContent: JSON) {
  updateEpubDocument(id: $id, title: $title, metadata: $metadata, tiptapContent: $tiptapContent) {
    id
    title
    metadata
    chapters
    tiptapContent
    createdAt
    updatedAt
  }
}

mutation CreateChapter($documentId: String!, $isEpub: Boolean, $title: String!, $order: Int!) {
  createChapter(documentId: $documentId, isEpub: $isEpub, title: $title, order: $order) {
    id
    title
    order
    sections
    paragraphs
    createdAt
    updatedAt
  }
}

mutation UpdateChapter($id: String!, $title: String, $order: Int) {
  updateChapter(id: $id, title: $title, order: $order) {
    id
    title
    order
    sections
    paragraphs
    createdAt
    updatedAt
  }
}

mutation CreateParagraph($chapterId: String, $sectionId: String, $order: Int!) {
  createParagraph(chapterId: $chapterId, sectionId: $sectionId, order: $order) {
    id
    order
    textNodes
    style
    createdAt
    updatedAt
  }
}

mutation UpdateParagraph($id: String!, $order: Int) {
  updateParagraph(id: $id, order: $order) {
    id
    order
    textNodes
    style
    createdAt
    updatedAt
  }
}

mutation CreateTextNode($paragraphId: String!, $content: String!, $order: Int!) {
  createTextNode(paragraphId: $paragraphId, content: $content, order: $order) {
    id
    content
    order
    belongsToParagraph
    style
    createdAt
    updatedAt
  }
}

mutation UpdateTextNode($id: String!, $content: String, $order: Int) {
  updateTextNode(id: $id, content: $content, order: $order) {
    id
    content
    order
    belongsToParagraph
    style
    createdAt
    updatedAt
  }
}

mutation DeleteTextNode($id: String!) {
  deleteTextNode(id: $id)
}

