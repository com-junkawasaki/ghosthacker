mutation CreateProject($name: String!, $author: String!, $description: String) {
  createProject(name: $name, author: $author, description: $description) {
    id
    name
    author
    description
    status
    createdAt
    updatedAt
  }
}

mutation UpdateProject($id: String!, $name: String, $author: String, $description: String, $status: String) {
  updateProject(id: $id, name: $name, author: $author, description: $description, status: $status) {
    id
    name
    author
    description
    status
    createdAt
    updatedAt
  }
}

mutation DeleteProject($id: String!) {
  deleteProject(id: $id)
}

