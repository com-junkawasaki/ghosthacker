mutation CreateScript($scriptText: String!, $derivedFromStory: String!, $status: String!) {
  createScript(scriptText: $scriptText, derivedFromStory: $derivedFromStory, status: $status) {
    id
    scriptText
    derivedFromStory
    status
    createdAt
    updatedAt
  }
}

mutation UpdateScript($id: String!, $scriptText: String, $status: String) {
  updateScript(id: $id, scriptText: $scriptText, status: $status) {
    id
    scriptText
    derivedFromStory
    status
    createdAt
    updatedAt
  }
}

mutation DeleteScript($id: String!) {
  deleteScript(id: $id)
}

