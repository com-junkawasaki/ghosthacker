mutation CreateStory($title: String!, $content: String!) {
  createStory(title: $title, content: $content) {
    id
    title
    content
    created_at
    updated_at
  }
}

mutation UpdateStory($id: String!, $title: String, $content: String) {
  updateStory(id: $id, title: $title, content: $content) {
    id
    title
    content
    created_at
    updated_at
  }
}

mutation DeleteStory($id: String!) {
  deleteStory(id: $id)
}

