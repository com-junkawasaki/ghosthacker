[package]
name = "producerv2-graphql"
version = "0.1.0"
edition = "2021"

[dependencies]
async-graphql = "7.0"
async-graphql-poem = "7.0"
poem = "1.3"
poem-openapi = "1.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
terminusdb-rs = { git = "https://github.com/ParapluOU/terminusdb-rs", branch = "main" }
dotenv = "0.15"
async-stream = "0.3"
tokio-stream = "0.1"
nanoid = "0.4"
chrono = { version = "0.4", features = ["serde"] }

