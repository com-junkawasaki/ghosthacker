services:
  postgres:
    image: postgres:16
    container_name: epub-editor-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - epub-editor-network

  graphql:
    build:
      context: ./performers/services/graphql
      dockerfile: Dockerfile
      target: development
    container_name: epub-editor-graphql
    ports:
      - "25325:8080"
    environment:
      NODE_ENV: development
      # PostgreSQL Connection
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Server Configuration
      PORT: 8080
      HOST: 0.0.0.0
      # Clerk Authentication (hardcoded for development)
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # AI Service Configuration (for future integration)
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      AI_SERVICE_ENDPOINT: ${AI_SERVICE_ENDPOINT:-}
    volumes:
      - ./performers/services/graphql:/app
      - /app/target
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - epub-editor-network
    command: cargo watch -x run

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: epub-editor-frontend
    ports:
      - "25320:3000"
    environment:
      NODE_ENV: development
      # Improve file watching reliability on macOS bind mounts
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: 1000
      # HMR Configuration for Docker
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_HMR_PORT: ${VITE_HMR_PORT:-3000}
      VITE_HMR_PROTOCOL: ${VITE_HMR_PROTOCOL:-ws}
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-25320}
      # App URLs (loaded from host env / .envrc)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:25320}
      # GraphQL API URL (Rust implementation)
      # Client-side: use localhost for browser access
      # Astro uses PUBLIC_ prefix for client-side environment variables
      PUBLIC_GRAPHQL_API_URL: ${PUBLIC_GRAPHQL_API_URL:-http://localhost:25325/graphql}
      NEXT_PUBLIC_GRAPHQL_API_URL: ${NEXT_PUBLIC_GRAPHQL_API_URL:-http://localhost:25325/graphql}
      # Server-side: use container name for server-to-server communication
      GRAPHQL_API_URL: ${GRAPHQL_API_URL:-http://graphql:8080/graphql}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.astro
    depends_on:
      - graphql
    networks:
      - epub-editor-network
    command: pnpm dev --host

volumes:
  postgres-data:

networks:
  epub-editor-network:
    name: epub-editor-network-v2
    driver: bridge

