services:
  neo4j:
    image: neo4j:5.15
    container_name: epub-editor-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - ./performers/services/graphql/neo4j-schema.cypher:/docker-entrypoint-initdb.d/01-schema.cypher:ro
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - epub-editor-network

  graphql:
    build:
      context: ./performers/services/graphql
      dockerfile: Dockerfile
      target: development
    container_name: epub-editor-graphql
    ports:
      - "25325:8080"
    environment:
      NODE_ENV: development
      # Neo4j Connection
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # Server Configuration
      PORT: 8080
      HOST: 0.0.0.0
      # Clerk Authentication (hardcoded for development)
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # AI Service Configuration (for future integration)
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      AI_SERVICE_ENDPOINT: ${AI_SERVICE_ENDPOINT:-}
    volumes:
      - ./performers/services/graphql:/app
      - /app/target
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - epub-editor-network
    command: cargo watch -x run

  graphql-go:
    build:
      context: ./performers/services/graphql-go
      dockerfile: Dockerfile
      target: development
    container_name: epub-editor-graphql-go
    ports:
      - "25326:8080"
    environment:
      NODE_ENV: development
      # Neo4j Connection
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # Server Configuration
      PORT: 8080
      HOST: 0.0.0.0
      # Clerk Authentication (hardcoded for development)
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # AI Service Configuration (for future integration)
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      AI_SERVICE_ENDPOINT: ${AI_SERVICE_ENDPOINT:-}
    volumes:
      - ./performers/services/graphql-go:/app
      - /app/tmp
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - epub-editor-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: epub-editor-frontend
    ports:
      - "25320:3000"
    environment:
      NODE_ENV: development
      # Improve file watching reliability on macOS bind mounts
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: 1000
      # App URLs (loaded from host env / .envrc)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:25320}
      # GraphQL API URL
      # Client-side: use localhost for browser access
      NEXT_PUBLIC_GRAPHQL_API_URL: ${NEXT_PUBLIC_GRAPHQL_API_URL:-http://localhost:25325/graphql}
      # Server-side: use container name for server-to-server communication
      GRAPHQL_API_URL: ${GRAPHQL_API_URL:-http://graphql:8080/graphql}
      # Clerk Authentication (hardcoded for development)
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_ZW5vdWdoLWNoaXBtdW5rLTkyLmNsZXJrLmFjY291bnRzLmRldiQ}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_FmPI35dNxAij0tuaX7rV5PDIDVmVvx8J11nyVyxEGu}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.astro
    depends_on:
      - graphql
    networks:
      - epub-editor-network
    command: pnpm dev --host

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-import:

networks:
  epub-editor-network:
    name: epub-editor-network-v2
    driver: bridge

