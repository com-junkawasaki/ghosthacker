services:
  postgres:
    image: postgres:16
    container_name: epub-editor-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - epub-editor-network

  graphql:
    build:
      context: ./performers/services/graphql
      dockerfile: Dockerfile
      target: development
    container_name: epub-editor-graphql
    ports:
      - "25325:8080"
    environment:
      NODE_ENV: development
      # PostgreSQL Connection
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Server Configuration
      PORT: 8080
      HOST: 0.0.0.0
      # AI Service Configuration (for future integration)
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      AI_SERVICE_ENDPOINT: ${AI_SERVICE_ENDPOINT:-}
      # Hume AI API Configuration (hardcoded for development)
      HUME_API: q0nGzfOSBZB4D0HbdZorGxek3wXz5O4XpTG8IkEJ0gY8Wlet
      HUME_API_KEY: LYSOLhalcwGNDdqxtlZOE4172bXGTzg0VxV30BatjXJPUtAULQ6ZoZmyBVTQE19s
      HUME_LANGUAGE_URL: https://api.hume.ai/v0/batch/jobs
      # OpenAI API Configuration (hardcoded for development)
      OPENAI_API_KEY: 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
      # Cargo watch configuration for HMR
      CARGO_WATCH_IGNORE: "target/**"
    volumes:
      - ./performers/services/graphql:/app
      - /app/target
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - epub-editor-network
    command: cargo watch -x "run" --ignore "target/**" --delay 0.5 --clear

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: epub-editor-frontend
    ports:
      - "25320:3000"
    environment:
      NODE_ENV: development
      # Improve file watching reliability on macOS bind mounts
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: 1000
      # Next.js HMR configuration
      FAST_REFRESH: "true"
      # App URLs (loaded from host env / .envrc)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:25320}
      # GraphQL API URL (Rust implementation)
      # Client-side: use localhost for browser access
      NEXT_PUBLIC_GRAPHQL_API_URL: ${NEXT_PUBLIC_GRAPHQL_API_URL:-http://localhost:25325/graphql}
      # Server-side: use container name for server-to-server communication
      GRAPHQL_API_URL: ${GRAPHQL_API_URL:-http://graphql:8080/graphql}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - graphql
    networks:
      - epub-editor-network
    command: sh -c "pnpm install && pnpm dev"

volumes:
  postgres-data:

networks:
  epub-editor-network:
    name: epub-editor-network-v2
    driver: bridge

