[package]
name = "epub-editor-graphql"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-graphql = "7"
async-graphql-poem = "7"
poem = { version = "1", features = ["tower-compat"] }
poem-openapi = "1"
neo4rs = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zip = "0.6"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"

