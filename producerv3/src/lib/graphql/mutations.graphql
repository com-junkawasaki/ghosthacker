mutation CreateEpub($input: CreateEpubInput!) {
  createEpub(input: $input) {
    id
    title
    language
    createdAt
    updatedAt
  }
}

mutation UpdateEpub($input: UpdateEpubInput!) {
  updateEpub(input: $input) {
    id
    title
    language
    updatedAt
  }
}

mutation DeleteEpub($id: ID!) {
  deleteEpub(id: $id)
}

