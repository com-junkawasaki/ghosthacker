query GetEpub($id: ID!) {
  epub(id: $id) {
    id
    title
    language
    created_at
    updated_at
    chapters {
      id
      title
      order
      content_html
      media {
        id
        type
        url
        mime_type
        file_size
      }
    }
    metadata {
      key
      value
    }
  }
}

query ListEpubs {
  epubList {
    id
    title
    language
    created_at
    updated_at
  }
}

query GetChapter($id: ID!) {
  chapter(id: $id) {
    id
    title
    order
    content_html
    paragraphs {
      id
      order
      content_html
    }
    media {
      id
      type
      url
      mime_type
      file_size
    }
  }
}

query GetChapters($epubId: ID!) {
  chapters(epubId: $epubId) {
    id
    title
    order
    content_html
  }
}

